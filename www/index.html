  tabbar.hidden=isQuiz||R.v==="review-grid";
  let html="";

  }

  html=`<header class="topbar">
    ${root?"":`<button class="tb-btn" data-act="back" aria-label="Back" style="margin-left:-9px">${ic("back",20)}</button>`}
    ${R.v==="home"?UJ(26):""}
    <div class="ttl"><h1>${t}</h1>${sub?`<span class="tb-sub">${sub}</span>`:""}</div>
    ${R.v==="home"?`<button class="tb-btn" data-act="stats" aria-label="Your progress">${ic("chart",20)}</button><button class="tb-btn" data-act="settings" aria-label="Settings">${ic("gear",20)}</button>`:""}
  </header><main id="app">`;
  switch(R.v){

    case "tests":html+=vTests();break;
    case "guide":html+=vGuide();break;

    case "english":html+=vEnglish();break;
    case "listen":html+=vListen();break;
    case "speak":html+=vSpeak();break;
    case "results":html+=vResults();break;
    case "review-grid":html+=vReviewGrid();break;
    case "review":html+=vReviewAnswers();break;
    case "stats":html+=vStats();break;
    case "settings":html+=vSettings();break;
    case "privacy":html+=vPrivacy();break;

  html+="</main>";

  const bus=document.querySelector(".bus");
  if(bus)requestAnimationFrame(()=>{bus.style.left=bus.dataset.left+"%";});
}

/* ===================== events ===================== */
function bind(root){
  if(!root||root.dataset.bound)return;
  root.dataset.bound="1";
  root.addEventListener("input",e=>{
    const el=e.target.closest("[data-act]");
    if(el&&el.dataset.act==="search"){
      const pos=el.selectionStart;
      R.q=el.value;render();
      const again=document.querySelector('[data-act="search"]');
      if(again){again.focus();try{again.setSelectionRange(pos,pos);}catch(err){}}
    }
  });
  root.addEventListener("keydown",e=>{
    const el=e.target.closest&&e.target.closest('[data-act][role="button"]');
    if(el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();el.click();}
  });
  root.addEventListener("change",e=>{
    const el=e.target.closest("[data-act]");
    if(el&&el.dataset.act==="testdate"){
      S.testDate=el.value||null;save();
      const cd=countdown();
      toast(cd?(cd.days>0?cd.days+" days to go":"Date saved"):"Date removed");
      render();
    }
  });
  let sx=0,sy=0;
  root.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  root.addEventListener("touchend",e=>{
    if(R.v!=="cards")return;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.5)return;
    const c=R.cat||"All";
    const deck=c==="All"?FLASHCARDS:FLASHCARDS.filter(x=>x.c===c);
    const i=R.ci||0;
    if(dx<0&&i<deck.length-1){R.ci=i+1;R.flip=false;render();}
    else if(dx>0&&i>0){R.ci=i-1;R.flip=false;render();}
  },{passive:true});
  root.addEventListener("click",e=>{
    const el=e.target.closest("[data-act]");if(!el)return;
    const a=el.dataset.act,n=el.dataset.n;
    switch(a){
      case "tab":if(R.v!==el.dataset.v){stack=[];go(el.dataset.v,{},true);}break;
      case "back":back();break;
      case "home":stack=[];go("home",{},true);break;
      case "stats":go("stats");break;
      case "settings":go("settings");break;
      case "tests":stack=[];go("tests",{},true);break;
      case "chapter":go("chapter",{n:+n});break;
      case "section":{S.last=el.dataset.id;save();go("section",{id:el.dataset.id});break;}
      case "mark-read":{S.read[el.dataset.id]=!S.read[el.dataset.id];if(!S.read[el.dataset.id])delete S.read[el.dataset.id];save();render();break;}
      case "cards":go("cards",{ci:0,flip:false});break;
      case "searchclear":R.q="";render();break;
      case "searchq":{const r=searchAll(R.q);if(r&&r.qs.length)startQuiz(pick(r.qs,Math.min(r.qs.length,25)),"practice","Search results");break;}
      case "privacy":go("privacy");break;
      case "english":go("english");break;
      case "listen":go("listen",{li:+el.dataset.i,la:{},tr:false});break;
      case "lplay":{
        if(TTS.busy){TTS.stop();render();break;}
        const L=LISTENING[R.li];
        const started=TTS.speak(L.x,+el.dataset.rate,()=>{if(R.v==="listen")render();});
        if(!started){R.tr=true;toast("No speech voice on this device");}
        render();break;}
      case "ltrans":R.tr=!R.tr;render();break;
      case "lans":{
        const L=LISTENING[R.li],j=+el.dataset.j;
        R.la=R.la||{};
        if(R.la[j]!==undefined)break;
        R.la[j]=+el.dataset.n;
        if(Object.keys(R.la).length===L.qs.length){
          S.lheard[R.li]=L.qs.filter((q,x)=>R.la[x]===q.k).length;
          bumpStreak();save();
        }
        render();break;}
      case "lreset":R.la={};render();break;
      case "speak":go("speak",{si:0});break;
      case "spstart":TTS.speak("You have one minute to prepare.");spRun("prep",60);break;
      case "sptalk":spRun("talk",120);break;
      case "spstop":spStop();render();break;
      case "spnext":spStop();R.si=(R.si||0)+1;render();break;
      case "spprev":spStop();R.si=(R.si||0)-1;render();break;
      case "spread":{const t=SPEAKING[R.si||0];TTS.speak(t.t+". You should say: "+t.c.join(". "),0.95);break;}
      case "readsec":{
        if(TTS.busy){TTS.stop();render();break;}
        let sec=null;CHAPTERS.forEach(c=>c.sections.forEach(x=>{if(x.id===el.dataset.id)sec=x;}));
        const txt=sec.title+". "+sec.body.map(strip).join(" ")+" Remember these. "+sec.keys.map(strip).join(". ");
        if(!TTS.speak(txt,0.95,()=>{if(R.v==="section")render();}))toast("No speech voice on this device");
        else render();
        break;}
      case "readq":{
        if(TTS.busy){TTS.stop();break;}
        const q=QUESTIONS[Z.ids[Z.i]],ord=Z.ord[Z.i];
        const txt=q.q+" "+ord.map((oi,n)=>"ABCD"[n]+". "+q.a[oi]).join(". ");
        if(!TTS.speak(txt,0.92))toast("No speech voice on this device");
        break;}
      case "cleardate":S.testDate=null;save();render();toast("Date removed");break;
      case "cat":go("cards",{cat:el.dataset.c,ci:0,flip:false},true);break;
      case "flip":R.flip=!R.flip;render();break;
      case "card-next":R.ci=(R.ci||0)+1;R.flip=false;render();break;
      case "card-prev":R.ci=(R.ci||0)-1;R.flip=false;render();break;
      case "card-shuffle":{const c=R.cat||"All";const deck=c==="All"?FLASHCARDS:FLASHCARDS.filter(x=>x.c===c);R.ci=Math.floor(Math.random()*deck.length);R.flip=false;render();toast("Shuffled");break;}
      case "acc":R.open=R.open===+el.dataset.i?null:+el.dataset.i;render();break;
      case "mock":startQuiz(pick(QUESTIONS.map((q,i)=>i),24),"exam","Mock test");break;
      case "daily":startQuiz(pick(QUESTIONS.map((q,i)=>i),10),"practice","Quick 10");break;
      case "rand":startQuiz(pick(QUESTIONS.map((q,i)=>i),+n),"practice",n+" questions");break;
      case "again":{
        const n2=Z?Math.min(Z.ids.length,20):10;
        if(Z&&Z.chapter)startQuiz(pick(idxOf(Z.chapter),Math.min(n2,idxOf(Z.chapter).length)),"practice",CHAPTERS.find(c=>c.n===Z.chapter).short,Z.chapter);
        else startQuiz(pick(QUESTIONS.map((q,i)=>i),n2),"practice","Practice");
        break;}
      case "weak":{const w=weakest();startQuiz(pick(idxOf(w.n),Math.min(15,idxOf(w.n).length)),"practice",CHAPTERS.find(c=>c.n===w.n).short);break;}
      case "practice-ch":{
        const all=idxOf(+n),sz=el.dataset.size?Math.min(+el.dataset.size,all.length):all.length;
        startQuiz(pick(all,sz),"practice",CHAPTERS.find(c=>c.n===+n).short,+n);break;}
      case "practice-ch-miss":{const ids=idxOf(+n).filter(i=>S.stats[i]&&S.stats[i].l===0);if(!ids.length){toast("No wrong answers in this chapter");break;}startQuiz(shuffle(ids),"practice","Fixing mistakes");break;}
      case "fix":{const m=missed();if(!m.length){toast("Nothing outstanding");break;}startQuiz(shuffle(m).slice(0,25),"practice","Fixing mistakes");break;}
      case "saved":{if(!S.marks.length){toast("No saved questions yet");break;}startQuiz(shuffle(S.marks.slice()),"practice","Saved");break;}
      case "opt":{
        if(Z.checked&&Z.mode==="practice")break;
        const q=QUESTIONS[Z.ids[Z.i]],v=+n;
        if(Array.isArray(q.k)){
          let s=Array.isArray(Z.sel)?Z.sel.slice():[];
          if(s.includes(v))s=s.filter(x=>x!==v);else{s.push(v);if(s.length>q.k.length)s.shift();}
          Z.sel=s;
        } else Z.sel=v;
        if(Z.mode==="exam"){
          const complete=Array.isArray(q.k)?(Array.isArray(Z.sel)&&Z.sel.length===q.k.length):(Z.sel!==null);
          if(complete)Z.ans[Z.i]=Z.sel;else delete Z.ans[Z.i];
        }
        render();break;}
      case "check":checkNow();break;
      case "next":nextQ();break;
      case "prev":prevQ();break;
      case "jump":Z.i=+n;Z.sel=Z.ans[Z.i]!==undefined?Z.ans[Z.i]:null;go("quiz",{},true);break;
      case "flagq":Z.flags[Z.i]=!Z.flags[Z.i];render();break;
      case "grid":go("review-grid");break;
      case "save":{const qi=Z.ids[Z.i];if(S.marks.includes(qi)){S.marks=S.marks.filter(x=>x!==qi);toast("Removed from saved");}else{S.marks.push(qi);toast("Saved for later");}save();render();break;}
      case "submit":finishQuiz();break;
      case "quit":{
        if(Z.mode==="exam"&&Object.keys(Z.ans).length&&!confirm("Leave the mock test? Your answers will be lost."))break;
        exitQuiz();break;}
      case "review-answers":go("review",{all:false});break;
      case "review-all":go("review",{all:true});break;
      case "theme":S.theme=el.dataset.v;save();applyPrefs();render();break;
      case "size":S.size=el.dataset.v;save();applyPrefs();render();break;
      case "reset":{if(confirm("Reset all progress, saved questions and test history? This cannot be undone.")){S=fresh();save();applyPrefs();stack=[];go("home",{},true);toast("Progress reset");}break;}
    }
  });
}
render();

/* splash */
(function(){
  const sp=document.getElementById("splash");
  if(!sp)return;
  let done=false;
  const hide=()=>{if(done)return;done=true;sp.classList.add("gone");setTimeout(()=>{if(sp.parentNode)sp.parentNode.removeChild(sp);},500);};
  sp.addEventListener("click",hide);
  let reduced=false;
  try{reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  let seen=false;
  try{seen=localStorage.getItem("settle.splash")==="1";localStorage.setItem("settle.splash","1");}catch(e){}
  if(seen||reduced)sp.classList.add("quick");
  setTimeout(hide,reduced?700:(seen?1100:4000));
})();
</script>
</body>
</html>
