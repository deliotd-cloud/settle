<!DOCTYPE html>
<html lang="en" data-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settle — Life in the UK Test Preparation</title>
<meta name="description" content="Study, practise and take timed mock tests for the Life in the UK test.">
<!-- fonts are bundled locally: see www/fonts/README.txt -->
<style>
/* Bundled typefaces. If the files are absent the stacks below fall back to
   the platform serif and sans, and the app still renders correctly offline. */
@font-face{font-family:"Newsreader";src:url("fonts/Newsreader.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"Newsreader";src:url("fonts/Newsreader-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Public Sans";src:url("fonts/PublicSans.woff2") format("woff2");font-weight:400 700;font-display:swap}
</style>
<style>
:root{
  --paper:#e7ecf7; --surface:#ffffff; --surface2:#f2f6fd; --raise:#ffffff;
  --ink:#0d1f43; --ink2:#44547a; --ink3:#5a6886;
  --rule:#cfd9ee; --rule2:#e3e9f6;
  --brass:#875b18; --brass-soft:#f3e6cc;
  --green:#1b6f4f; --green-soft:#dcf0e6;
  --red:#a81f33; --red-soft:#fae0e3;
  --on-ink:#f4f7fd; --tint:rgba(1,33,105,.06); --road:#c2cee6; --roadline:#ffffff;
  --shadow:0 -1px 0 var(--rule);
  --fs:16px;
  --r-s:6px; --r-m:12px; --r-l:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#06122b; --surface:#0e2149; --surface2:#16305f; --raise:#16305f;
    --ink:#e9effb; --ink2:#a9bcdd; --ink3:#8ba1c6;
    --rule:#24406f; --rule2:#1d3561;
    --brass:#e0ad4c; --brass-soft:#3d3115;
    --green:#4fc894; --green-soft:#0f3a2e;
    --red:#f0798c; --red-soft:#431d2c;
    --on-ink:#06122b; --tint:rgba(70,120,215,.14); --road:#1c3462; --roadline:#7f95bd;
  }
}
:root[data-theme="dark"]{
  --paper:#06122b; --surface:#0e2149; --surface2:#16305f; --raise:#16305f;
  --ink:#e9effb; --ink2:#a9bcdd; --ink3:#8ba1c6;
  --rule:#24406f; --rule2:#1d3561;
  --brass:#e0ad4c; --brass-soft:#3d3115;
  --green:#4fc894; --green-soft:#0f3a2e;
  --red:#f0798c; --red-soft:#431d2c;
  --on-ink:#06122b; --tint:rgba(70,120,215,.14); --road:#1c3462; --roadline:#7f95bd;
}
html[data-size="small"]{--fs:15px}
html[data-size="large"]{--fs:18px}
html[data-size="xlarge"]{--fs:20px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  background-image:radial-gradient(130% 62% at 50% 0%, var(--tint) 0%, rgba(0,0,0,0) 60%);
  background-attachment:fixed;
  font-family:"Public Sans",Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs); line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{font-family:"Newsreader","Noto Serif",Georgia,serif;font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:2px}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px;border-radius:3px}

#shell{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--paper);
  background-image:radial-gradient(130% 700% at 50% 0%, var(--tint) 0%, rgba(0,0,0,0) 60%);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  min-height:52px;
}
.topbar .ttl{flex:1;min-width:0}
.topbar h1{font-size:1.18rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tb-sub{display:block;margin-top:-1px}
.tb-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);flex:none}
.tb-btn:active{background:var(--surface2)}
.tb-sub{font-size:.72rem;color:var(--ink3);letter-spacing:.02em}

/* ---------- layout ---------- */
main{padding:18px 16px 96px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink2)}
.tiny{font-size:.78rem;line-height:1.45}
.center{text-align:center}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:16px}
.panel h2{font-size:1.12rem;margin-bottom:6px}
.panel h3{font-size:1rem;margin-bottom:4px}

.sect-label{
  font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:1.32rem;font-weight:600;
  margin:22px 0 2px;display:flex;align-items:baseline;gap:8px;
}
.sect-label:first-child{margin-top:0}
.sect-note{font-size:.82rem;color:var(--ink3);margin-bottom:10px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:var(--on-ink);
  padding:13px 18px;border-radius:var(--r-s);font-weight:600;font-size:.95rem;
  width:100%;transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.985);opacity:.92}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.btn.brass{background:var(--brass);color:#fff}
:root[data-theme="dark"] .btn.brass, :root:not([data-theme="light"]) .btn.brass{color:#1a1204}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn-row{display:flex;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--rule2);
  padding:9px 13px;min-height:38px;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--ink2);
}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip.brass{background:var(--brass-soft);color:var(--brass);border-color:transparent}

/* ---------- the bus route ---------- */
.blind{
  display:flex;align-items:center;gap:9px;background:#10161f;border-radius:4px;
  padding:7px 9px;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.blind .rno{
  background:#f4f4f2;color:#10161f;border-radius:2px;padding:2px 7px;
  font-size:.82rem;font-weight:800;letter-spacing:.01em;line-height:1.25;
}
.blind .rdest{
  color:#f5c24a;font-size:.66rem;font-weight:700;letter-spacing:.16em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.road{position:relative;height:68px;margin:12px 0 2px}
.tarmac{position:absolute;left:0;right:0;top:30px;height:12px;background:var(--road);border-radius:3px}
.tarmac::after{
  content:"";position:absolute;left:8px;right:8px;top:5px;height:2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--roadline) 0 9px,transparent 9px 19px);opacity:.75;
}
.bstop{
  position:absolute;top:29px;transform:translateX(-50%);width:66px;
  display:flex;flex-direction:column;align-items:center;background:none;
}
.bstop i{
  width:11px;height:11px;border-radius:50%;background:var(--paper);
  border:2.5px solid var(--ink3);display:block;flex:none;
}
.bstop.part i{border-color:var(--brass)}
.bstop.done i{background:var(--brass);border-color:var(--brass)}
.bstop span{font-size:.575rem;font-weight:600;margin-top:6px;color:var(--ink3);white-space:nowrap;letter-spacing:.02em}
.bstop.done span{color:var(--ink2)}
.bstop.term i{
  width:13px;height:13px;border:3px solid var(--red);background:var(--paper);position:relative;
}
.bstop.term.done i{background:var(--red)}
.bstop.term span{color:var(--red)}
@media (max-width:360px){.bstop span{font-size:.53rem}.bstop{width:54px}}
.bus{position:absolute;bottom:38px;transform:translateX(-50%);left:6%;transition:left 1.3s cubic-bezier(.34,.9,.25,1);pointer-events:none}
.bus svg{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}
/* ---------- home: the line diagram ---------- */
.hero{padding:2px 2px 4px}
.hero-kicker{font-size:.8rem;color:var(--ink3);margin-bottom:2px}
.hero h2{font-size:1.75rem;line-height:1.12;margin-bottom:10px}
.readiness{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.readbar{flex:1;height:8px;background:var(--rule2);border-radius:99px;overflow:hidden}
.readbar i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.readnum{font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}

.line{position:relative;margin:8px 0 0;padding-left:0}
.line::before{content:"";position:absolute;left:21px;top:26px;bottom:26px;width:3px;background:var(--rule);border-radius:2px}
.stop{
  position:relative;display:flex;gap:14px;align-items:center;
  background:none;width:100%;text-align:left;padding:9px 4px;border-radius:var(--r-s);
}
.stop:active{background:var(--surface2)}
.stop .ring{flex:none;width:44px;height:44px;position:relative;z-index:2}
.stop .ring svg{display:block;transform:rotate(-90deg)}
.stop .ring b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:.7rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);
}
.stop .txt{flex:1;min-width:0}
.stop .txt strong{display:block;font-size:.98rem;font-weight:600}
.stop .txt span{display:block;font-size:.78rem;color:var(--ink3)}
.stop .go{color:var(--ink3);flex:none}

/* ---------- list rows ---------- */
.rows{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 15px;border-bottom:1px solid var(--rule2)}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface2)}
.row .num{
  flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);
  display:grid;place-items:center;font-size:.76rem;font-weight:700;color:var(--ink2);
  font-variant-numeric:tabular-nums;border:1px solid var(--rule2);
}
.row .num.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.row .body{flex:1;min-width:0}
.row .body strong{display:block;font-weight:600;font-size:.95rem}
.row .body span{display:block;font-size:.78rem;color:var(--ink3)}
.row .end{flex:none;color:var(--ink3);font-size:.78rem;display:flex;align-items:center;gap:8px}

/* ---------- quiz ---------- */
.qbar{
  position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;
}
.qbar-top{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.qbar-top .count{font-size:.8rem;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:.88rem;color:var(--ink2);margin-left:auto}
.timer.warn{color:var(--red)}
.track{height:4px;background:var(--rule2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s ease}

.question{font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:1.3rem;line-height:1.32;margin:18px 0 6px}
.qmeta{font-size:.76rem;color:var(--ink3);margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--rule);border-radius:var(--r-s);
  padding:13px 14px;font-size:.95rem;line-height:1.4;transition:border-color .15s,background .15s;
}
.opt .mark{
  flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);
  display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--ink3);margin-top:1px;
}
.opt.sel{border-color:var(--ink);background:var(--surface2)}
.opt.sel .mark{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .mark{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .mark{background:var(--red);border-color:var(--red);color:#fff}
.opt.locked{pointer-events:none}

.feedback{
  margin-top:16px;border-radius:var(--r-m);padding:14px 15px;
  border-left:4px solid var(--green);background:var(--green-soft);
  animation:rise .22s ease-out;
}
.feedback.no{border-left-color:var(--red);background:var(--red-soft)}
.feedback strong{display:block;font-size:.9rem;margin-bottom:3px}
.feedback p{font-size:.88rem;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.qfoot{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:var(--paper);border-top:1px solid var(--rule);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.qfoot-in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center}

/* ---------- results ---------- */
.verdict{text-align:center;padding:26px 16px 22px;border-radius:var(--r-l);border:1px solid var(--rule);background:var(--surface)}
.verdict .score{font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:3.4rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.verdict .of{font-size:1.1rem;color:var(--ink3)}
.verdict .tag{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:999px;font-size:.82rem;font-weight:700}
.verdict .tag.pass{background:var(--green-soft);color:var(--green)}
.verdict .tag.fail{background:var(--red-soft);color:var(--red)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.bar-row .lab{font-size:.85rem;font-weight:500}
.bar-row .val{font-size:.8rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar-row .tr{grid-column:1/-1;height:7px;background:var(--rule2);border-radius:99px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .7s ease}

/* ---------- study notes ---------- */
.prose{font-size:1rem;line-height:1.65}
.prose h3{font-size:1.16rem;margin:22px 0 7px}
.prose h3:first-child{margin-top:0}
.prose p{margin-bottom:.9em}
.prose em{font-style:italic}
.keybox{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:var(--r-s);padding:14px 15px;margin:16px 0}
.keybox strong.kbt{display:block;font-size:.8rem;color:var(--brass);margin-bottom:8px;font-weight:700}
.keybox ul{margin:0;padding-left:18px}
.keybox li{margin-bottom:6px;font-size:.9rem;line-height:1.45}
.keybox li:last-child{margin-bottom:0}
.keybox li b{font-weight:700}

/* ---------- flashcards ---------- */
.cardwrap{perspective:1200px;margin:6px 0 16px}
.flip{position:relative;width:100%;min-height:270px;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--rule);border-radius:var(--r-l);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 24px;text-align:center;
}
.face.back{transform:rotateY(180deg);background:var(--surface2)}
.face .lab{font-size:.72rem;color:var(--ink3);margin-bottom:12px}
.face .t{font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:1.5rem;line-height:1.25}
.face .d{font-size:1.02rem;line-height:1.5}
.face .hint{position:absolute;bottom:14px;font-size:.72rem;color:var(--ink3)}

/* ---------- guide ---------- */
.acc{border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.acc + .acc{margin-top:10px}
.acc>button{display:flex;width:100%;gap:12px;align-items:center;padding:15px;text-align:left}
.acc>button strong{flex:1;font-size:.97rem;font-weight:600}
.acc .inner{padding:0 15px 16px;font-size:.93rem;line-height:1.6;color:var(--ink)}
.acc .inner ul{padding-left:18px;margin:.6em 0}
.acc .inner li{margin-bottom:7px}
.acc .inner h4{font-size:1rem;margin:14px 0 5px}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--ink3);font-size:.66rem;font-weight:600;white-space:nowrap;min-height:52px;justify-content:center}
.tab.on{color:var(--ink)}
.tab.on .ic{background:var(--surface2)}
.ic{width:34px;height:24px;border-radius:99px;display:grid;place-items:center}

/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:13px 14px}
.stat b{display:block;font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:1.6rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--ink3)}
.empty{text-align:center;padding:34px 20px;color:var(--ink3)}
.empty p{font-size:.9rem}
.toast{
  position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;
  font-size:.85rem;font-weight:600;animation:rise .2s ease-out;max-width:88%;text-align:center;
}
.seg{display:flex;background:var(--surface2);border:1px solid var(--rule2);border-radius:var(--r-s);padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:4px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.searchwrap{position:relative;margin-bottom:16px}
.searchwrap>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.searchbar{width:100%;background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;
  padding:12px 42px 12px 40px;font:inherit;font-size:.95rem;color:var(--ink);-webkit-appearance:none}
.searchbar::placeholder{color:var(--ink3)}
.searchclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  display:grid;place-items:center;border-radius:50%;color:var(--ink3)}
.hit{font-size:.88rem;line-height:1.5}
.hit b{color:var(--ink)}
.disclaimer{font-size:.74rem;color:var(--ink3);line-height:1.5;padding:4px 2px 0}
.bigplay{width:100%;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:16px}
.bigplay .disc{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.bigplay.on .disc{background:var(--brass);color:#fff}
.bigplay .t{flex:1;text-align:left}
.bigplay .t strong{display:block;font-size:.98rem}
.bigplay .t span{display:block;font-size:.78rem;color:var(--ink3)}
.dateinput{width:100%;background:var(--surface2);border:1.5px solid var(--rule);border-radius:var(--r-s);padding:12px 13px;font:inherit;color:var(--ink);font-size:.95rem}
.clock-big{font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:3.2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.cues{margin:0;padding-left:20px}
.cues li{margin-bottom:8px;font-size:.95rem;line-height:1.5}
.count-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:var(--r-m);padding:14px 15px}
.count-card b{font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:2.1rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.spk{flex:none}
.flagdot{width:7px;height:7px;border-radius:50%;background:var(--brass);display:inline-block}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{flex:none}
.gridnums{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.gn{aspect-ratio:1;min-height:44px;border-radius:var(--r-s);border:1.5px solid var(--rule);display:grid;place-items:center;font-size:.82rem;font-weight:600;color:var(--ink2);background:var(--surface);position:relative}
.gn.ans{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.gn.cur{outline:2.5px solid var(--brass);outline-offset:1px}
.gn.flag::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--brass)}

/* ---------- splash ---------- */
#splash{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(120% 90% at 50% 38%, #0b2a5b 0%, #05132c 70%, #030c1d 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  color:#fff;transition:opacity .4s ease, visibility .4s;
  animation:spAuto .3s linear 6s forwards;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash.quick *{animation-delay:0s!important;animation-duration:.3s!important}
#splash.quick .sp-skip{display:none}
.spflag{width:min(56vw,208px);height:auto;filter:drop-shadow(0 8px 26px rgba(0,0,0,.5));border-radius:3px}
.sp-field{opacity:0;animation:spFade .35s ease forwards}
.sp-andrew path{stroke-dasharray:100;stroke-dashoffset:100;animation:spDraw .7s ease .35s forwards}
.sp-patrick{opacity:0;animation:spFade .45s ease 1.1s forwards}
.sp-george path{stroke-dasharray:100;stroke-dashoffset:100;animation:spDraw .65s ease 1.75s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFade{to{opacity:1}}
.sp-saints{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:9px;margin-top:24px;min-height:24px;
}
.sp-saints span,.sp-saints i{opacity:0;animation:spIn .55s ease forwards}
.sp-saints span{font-size:.92rem;font-weight:500;color:#dbe7fa;white-space:nowrap}
.sp-saints i{font-style:normal;color:#46608f}
.sp-saints>:nth-child(1){animation-delay:.95s}
.sp-saints>:nth-child(2),.sp-saints>:nth-child(3){animation-delay:1.5s}
.sp-saints>:nth-child(4),.sp-saints>:nth-child(5){animation-delay:2.3s}
@keyframes spIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sp-name{
  font-family:"Newsreader","Noto Serif",Georgia,serif;font-size:2.6rem;font-weight:600;line-height:1;
  letter-spacing:-.015em;opacity:0;animation:spRise .55s cubic-bezier(.2,.8,.2,1) 2.75s forwards;
}
.sp-sub{font-size:.86rem;color:#a8bfe2;margin-top:9px;opacity:0;animation:spRise .55s cubic-bezier(.2,.8,.2,1) 2.95s forwards}
.sp-skip{position:absolute;bottom:26px;font-size:.74rem;color:#6a80a8;opacity:0;animation:spFade .5s ease 1.2s forwards}
@keyframes spAuto{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes spRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}
}
/* ---------- flag and landmark motifs ---------- */
.uj{border-radius:2px;display:block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
.skyline{display:block;width:100%;height:auto;color:var(--ink);opacity:.2;margin:2px 0 10px}
.skyline-cap{font-size:.68rem;color:var(--ink3);text-align:center;margin:-6px 0 14px}
.lm{color:var(--ink3);opacity:.45;flex:none;display:grid;place-items:center;margin-right:2px}
.ch-head{position:relative;overflow:hidden}
.ch-glyph{position:absolute;right:-6px;top:50%;transform:translateY(-50%);opacity:.12;color:var(--ink);pointer-events:none}
.verdict .uj{margin:0 auto 14px}
</style>

<script>
const QUESTIONS=[
/* ===== CHAPTER 1 — VALUES AND PRINCIPLES ===== */
{c:1,t:"Values",q:"Which of these is one of the fundamental principles of British life?",a:["Tolerance of those with different faiths and beliefs","Compulsory military service","Membership of a political party","Attending a religious service each week"],k:0,e:"The fundamental principles are democracy, the rule of law, individual liberty, tolerance of those with different faiths and beliefs, and participation in community life."},
{c:1,t:"Values",q:"Which TWO of these are responsibilities of everyone living in the UK?",a:["Looking after the area you live in and the environment","Treating others with fairness","Joining a trade union","Flying a flag on national holidays"],k:[0,1],e:"Responsibilities include obeying the law, respecting the rights of others, treating others with fairness, looking after yourself and your family, and looking after the area you live in and the environment."},
{c:1,t:"Values",q:"What does the 'rule of law' mean?",a:["Everyone, including people in government, is subject to the law","Only judges are required to follow the law","Laws apply differently depending on your income","The monarch can change any law at will"],k:0,e:"Under the rule of law nobody is above the law — including ministers, officials and the monarch."},
{c:1,t:"Ceremony",q:"At a citizenship ceremony, what do new citizens make?",a:["An oath (or affirmation) of allegiance and a pledge of loyalty to the UK","A payment of a one-off tax","A promise to join the armed forces","A written examination"],k:0,e:"You swear or affirm allegiance to the monarch and pledge loyalty to the UK, respecting its rights, freedoms and laws."},
{c:1,t:"Ceremony",q:"Where do citizenship ceremonies usually take place?",a:["At the local council or register office","At the Houses of Parliament","At a police station","At the nearest airport"],k:0,e:"Ceremonies are normally arranged by your local authority and held at a register office or civic building, usually in a group."},
{c:1,t:"Requirements",q:"What are the two parts of the 'Knowledge of Language and Life' requirement?",a:["The Life in the UK test and an English language qualification","A driving test and an English test","A written essay and an interview","A history exam and a maths exam"],k:0,e:"Most applicants for settlement or citizenship must pass the Life in the UK test and demonstrate English at the required level."},
{c:1,t:"Requirements",q:"Which level of English speaking and listening is normally required for settlement or citizenship?",a:["B1 of the Common European Framework of Reference","A1","C2","No level is required"],k:0,e:"B1 speaking and listening is the usual standard, though a degree taught in English or being a national of a majority English-speaking country can satisfy it instead."},
{c:1,t:"Requirements",q:"What score is needed to pass the Life in the UK test?",a:["75% — at least 18 correct out of 24","50% — 12 out of 24","100%","60% — 15 out of 24"],k:0,e:"You answer 24 questions in 45 minutes and need 18 correct answers to pass."},
{c:1,t:"Requirements",q:"Which age group normally has to take the Life in the UK test?",a:["18 to 64","16 to 70","21 to 60","Everybody, at any age"],k:0,e:"People aged under 18 or 65 and over are normally exempt, as are those with a long-term physical or mental condition supported by medical evidence."},
{c:1,t:"Values",q:"Is it acceptable in the UK to treat someone less favourably because of their religion?",a:["No — this is discrimination and is against the law","Yes, if you disagree with their beliefs","Only in private businesses","Only outside working hours"],k:0,e:"Discrimination because of religion or belief is unlawful under equality legislation, and tolerance of different faiths is a core value."},
{c:1,t:"Values",q:"Which of these is NOT one of the fundamental principles of British life?",a:["Everyone must join a political party","Democracy","Individual liberty","Participation in community life"],k:0,e:"Political participation is encouraged but never compulsory."},
{c:1,t:"Values",q:"What does 'individual liberty' mean in the context of British values?",a:["People are free to make their own choices within the law","People may ignore laws they disagree with","Only citizens have freedoms","The government decides your career"],k:0,e:"Individual liberty means freedom of belief, speech and action, exercised within the boundaries of the law and the rights of others."},
{c:1,t:"Values",q:"Which TWO of these are ways of taking part in community life?",a:["Volunteering for a local charity","Helping at your child's school","Refusing to pay council tax","Avoiding your neighbours"],k:[0,1],e:"Volunteering, school governance, jury service and helping neighbours are all valued forms of participation."},
{c:1,t:"Requirements",q:"If you fail the Life in the UK test, when can you take it again?",a:["After 7 days, paying the fee again","Never — one attempt only","After 12 months","Immediately, at no extra cost"],k:0,e:"There is no limit on attempts, but you must wait 7 days between them and pay the fee each time."},
{c:1,t:"Requirements",q:"How long is a Life in the UK test pass valid for?",a:["Indefinitely — you do not need to retake it","One year","Three years","Only for a single application"],k:0,e:"If you passed for settlement you do not need to take it again for citizenship; keep your unique reference number safe."},

/* ===== CHAPTER 2 — WHAT IS THE UK ===== */
{c:2,t:"The UK",q:"Which four countries make up the United Kingdom?",a:["England, Scotland, Wales and Northern Ireland","England, Scotland, Wales and Ireland","England, Wales, Northern Ireland and the Isle of Man","England, Scotland, Northern Ireland and Jersey"],k:0,e:"The UK's full name is the United Kingdom of Great Britain and Northern Ireland."},
{c:2,t:"The UK",q:"Which countries make up Great Britain?",a:["England, Scotland and Wales","England and Wales only","England, Scotland and Northern Ireland","All of the British Isles"],k:0,e:"Great Britain is the largest island — England, Scotland and Wales. Adding Northern Ireland gives you the UK."},
{c:2,t:"The UK",q:"Is the Isle of Man part of the United Kingdom?",a:["No — it is a Crown dependency with its own government","Yes, it is a county of England","Yes, it is part of Scotland","No — it is part of the Republic of Ireland"],k:0,e:"The Isle of Man and the Channel Islands are Crown dependencies: closely linked to the UK but with their own parliaments and laws."},
{c:2,t:"The UK",q:"Which of these is a British overseas territory?",a:["The Falkland Islands","Jersey","The Isle of Man","The Republic of Ireland"],k:0,e:"Overseas territories such as the Falkland Islands and St Helena are linked to the UK but are not part of it."},
{c:2,t:"The UK",q:"Where does the UK Parliament sit?",a:["Westminster, in London","Holyrood, in Edinburgh","Stormont, in Belfast","Cardiff Bay"],k:0,e:"The UK Parliament meets at the Palace of Westminster in London."},
{c:2,t:"The UK",q:"What is the capital city of Scotland?",a:["Edinburgh","Glasgow","Aberdeen","Stirling"],k:0,e:"Edinburgh is the capital; Glasgow is Scotland's largest city."},
{c:2,t:"The UK",q:"What is the capital city of Northern Ireland?",a:["Belfast","Derry/Londonderry","Dublin","Armagh"],k:0,e:"Belfast is the capital and the seat of the Northern Ireland Assembly at Stormont."},
{c:2,t:"The UK",q:"What is the capital city of Wales?",a:["Cardiff","Swansea","Newport","Bangor"],k:0,e:"Cardiff is Wales's capital and the home of the Senedd, the Welsh Parliament."},
{c:2,t:"The UK",q:"In which parts of the UK is Gaelic spoken?",a:["Parts of Scotland and, in a related form, Northern Ireland","Only in Cornwall","Across the whole of England","Only in Wales"],k:0,e:"Scottish Gaelic is spoken in parts of the Highlands and Islands; Irish Gaelic is spoken in Northern Ireland, and Welsh is widely spoken in Wales."},
{c:2,t:"The UK",q:"Roughly how large is the population of the UK today?",a:["Around 68 million","Around 20 million","Around 120 million","Around 5 million"],k:0,e:"The population has grown steadily and is now roughly 68 million, with about 84% living in England."},
{c:2,t:"The UK",q:"Is the Republic of Ireland part of the United Kingdom?",a:["No — it is an independent country","Yes","Only for trade purposes","Only Northern counties are"],k:0,e:"The Republic of Ireland became fully independent in the twentieth century and is a separate sovereign state."},
{c:2,t:"The UK",q:"Which language, spoken in Wales, is taught in schools and used on road signs there?",a:["Welsh","Cornish","Gaelic","Ulster Scots"],k:0,e:"Welsh has equal status with English in Wales and is widely used in education, broadcasting and public life."},

/* ===== CHAPTER 3 — HISTORY ===== */
{c:3,t:"Early Britain",q:"What is Stonehenge?",a:["A prehistoric stone monument in Wiltshire","A Roman fort on Hadrian's Wall","A Norman castle in Kent","A Victorian railway station"],k:0,e:"Stonehenge, in Wiltshire, dates from the Stone Age into the Bronze Age and was probably used for seasonal ceremonies."},
{c:3,t:"Early Britain",q:"Skara Brae, on Orkney, is important because it is:",a:["The best preserved prehistoric village in northern Europe","The oldest Roman villa in Britain","A Viking burial ship","A medieval monastery"],k:0,e:"Skara Brae's stone houses survived under sand and show how Stone Age people in Britain lived."},
{c:3,t:"Early Britain",q:"How did the first people reach what is now Britain?",a:["They walked across a land bridge from the continent","They arrived by aeroplane","They sailed from Africa in the Middle Ages","They were brought by the Romans"],k:0,e:"Britain was joined to the European mainland until rising sea levels flooded the land bridge around 10,000 years ago."},
{c:3,t:"Early Britain",q:"What were the people of the Iron Age in Britain skilled at?",a:["Making weapons and tools from iron, and minting the first coins","Building railways","Producing paper","Making glass windows"],k:0,e:"Iron Age people built hill forts such as Maiden Castle in Dorset and produced Britain's first coins, some carrying rulers' names."},
{c:3,t:"Romans",q:"In which year did the Romans successfully invade Britain under the Emperor Claudius?",a:["AD 43","55 BC","AD 410","AD 1066"],k:0,e:"Julius Caesar's raids in 55 BC failed; the lasting conquest began in AD 43 and Roman rule lasted nearly 400 years."},
{c:3,t:"Romans",q:"Who led an uprising of the Iceni tribe against the Romans?",a:["Boudicca","Cleopatra","Elizabeth I","Mary Queen of Scots"],k:0,e:"Boudicca, queen of the Iceni in eastern England, led a famous revolt; a statue of her stands near Westminster Bridge."},
{c:3,t:"Romans",q:"Why was Hadrian's Wall built?",a:["To keep out tribes from the north and control movement and trade","To stop flooding","As a Roman racecourse","To mark the border with Wales"],k:0,e:"Built on the orders of the Emperor Hadrian around AD 122, parts of it, along with its forts, survive today."},
{c:3,t:"Romans",q:"Which parts of the British Isles did the Romans never conquer?",a:["Scotland and Ireland","Wales and Cornwall","Kent and Sussex","The Isle of Wight"],k:0,e:"Roman control stopped short of Scotland — hence Hadrian's Wall — and never extended to Ireland."},
{c:3,t:"Anglo-Saxons",q:"Which burial site in Suffolk is associated with an Anglo-Saxon king?",a:["Sutton Hoo","Skara Brae","Maiden Castle","Bath"],k:0,e:"The ship burial at Sutton Hoo contained treasure, armour and coins, showing the wealth of Anglo-Saxon kingdoms."},
{c:3,t:"Anglo-Saxons",q:"Who was sent from Rome in AD 597 and became the first Archbishop of Canterbury?",a:["St Augustine","St Columba","St Patrick","St David"],k:0,e:"St Augustine led the conversion of the Anglo-Saxons in the south, while St Columba founded a monastery on Iona in the north."},
{c:3,t:"Vikings",q:"When did Viking raids on Britain first begin?",a:["AD 789","AD 43","AD 1215","AD 1666"],k:0,e:"The Vikings came from Denmark and Norway, raiding at first and later settling, particularly in the east and north."},
{c:3,t:"Vikings",q:"Which Anglo-Saxon king defeated the Vikings and is remembered as 'the Great'?",a:["Alfred","Harold","Canute","Egbert"],k:0,e:"Alfred of Wessex resisted the Viking invasions and united much of England; Viking settlers remained in the Danelaw."},
{c:3,t:"Vikings",q:"Who is said to have united the Scottish kingdoms to become the first king of Scotland?",a:["Kenneth MacAlpin","Robert the Bruce","William Wallace","James VI"],k:0,e:"Kenneth MacAlpin brought together the Picts and the Scots in the ninth century."},
{c:3,t:"Normans",q:"What happened at the Battle of Hastings in 1066?",a:["William of Normandy defeated King Harold and became king of England","The Vikings were finally expelled","The Romans landed in Kent","Parliament was created"],k:0,e:"The Norman Conquest of 1066 was the last successful foreign invasion of England and transformed its language, law and landholding."},
{c:3,t:"Normans",q:"What is the Bayeux Tapestry?",a:["An embroidery telling the story of the Norman invasion of 1066","A Victorian carpet from Manchester","A Roman mosaic from Bath","A Tudor painting of Henry VIII"],k:0,e:"It can still be seen in France and depicts the events leading to the Battle of Hastings."},
{c:3,t:"Normans",q:"What was the Domesday Book?",a:["A survey of the land and people of England ordered by William the Conqueror","A book of Norman poetry","A list of church saints","The first English dictionary"],k:0,e:"Completed in 1086, it recorded who owned what across England and is still used by historians today."},
{c:3,t:"Middle Ages",q:"What did Magna Carta, agreed in 1215, establish?",a:["That the king was subject to the law and had to respect certain rights","That women could vote","That England would leave the Church","That Parliament would sit every year"],k:0,e:"King John agreed the 'Great Charter' after pressure from his barons; it is a foundation stone of British liberties."},
{c:3,t:"Middle Ages",q:"In which battle did Robert the Bruce defeat the English in 1314?",a:["Bannockburn","Hastings","Agincourt","Bosworth Field"],k:0,e:"Bannockburn secured Scottish independence for a further period, though conflict between the two kingdoms continued."},
{c:3,t:"Middle Ages",q:"How long did the Hundred Years War between England and France last?",a:["From 1337 to 1453 — 116 years","Exactly 100 years","From 1066 to 1166","Only ten years"],k:0,e:"Despite the name, the conflict ran for well over a century and ended with the English losing almost all their French lands."},
{c:3,t:"Middle Ages",q:"Which English king won the Battle of Agincourt in 1415?",a:["Henry V","Richard III","Edward I","Henry VIII"],k:0,e:"Henry V's victory against a much larger French army became one of the most celebrated in English history."},
{c:3,t:"Middle Ages",q:"What was the Black Death?",a:["A plague that killed a huge share of the population from 1348","A great fire in London","A famine in Ireland","A naval battle with Spain"],k:0,e:"The plague killed perhaps a third of the population of England, causing labour shortages that reshaped society."},
{c:3,t:"Middle Ages",q:"Under Edward I, Wales was:",a:["Annexed to England by statute in 1284","Granted full independence","Given its own parliament","Sold to France"],k:0,e:"Edward I's campaigns and castle-building brought Wales under English control, confirmed by statute in 1284."},
{c:3,t:"Wars of the Roses",q:"The Wars of the Roses were fought between which two houses?",a:["Lancaster and York","Tudor and Stuart","Normandy and Wessex","Hanover and Windsor"],k:0,e:"Lancaster's emblem was a red rose and York's a white rose; the fighting ran from 1455 to 1485."},
{c:3,t:"Wars of the Roses",q:"Who won the Battle of Bosworth Field in 1485 and founded the Tudor dynasty?",a:["Henry Tudor, who became Henry VII","Richard III","Edward IV","Henry V"],k:0,e:"Henry VII married Elizabeth of York and created the Tudor rose, combining the red and white roses."},
{c:3,t:"Tudors",q:"How many wives did Henry VIII have?",a:["Six","Two","Four","Eight"],k:0,e:"Catherine of Aragon, Anne Boleyn, Jane Seymour, Anne of Cleves, Catherine Howard and Catherine Parr — divorced, beheaded, died; divorced, beheaded, survived."},
{c:3,t:"Tudors",q:"Why did Henry VIII break away from the Church of Rome?",a:["The Pope refused to annul his first marriage, so he made himself head of the Church in England","He wanted to become a monk","He was ordered to by Parliament","To join the Church of Scotland"],k:0,e:"The break led to the Church of England, the dissolution of the monasteries and lasting religious conflict."},
{c:3,t:"Tudors",q:"Which of Henry VIII's children was known as 'Bloody Mary'?",a:["Mary I, for her persecution of Protestants","Mary Queen of Scots","Mary II","Queen Anne"],k:0,e:"Mary I tried to restore Roman Catholicism; her half-sister Elizabeth I succeeded her in 1558."},
{c:3,t:"Tudors",q:"What happened to the Spanish Armada in 1588?",a:["It was defeated by the English fleet under Elizabeth I","It successfully invaded England","It sailed to America","It was sunk by the French"],k:0,e:"The defeat of the Armada is remembered as one of the great moments of the Elizabethan age."},
{c:3,t:"Tudors",q:"Mary, Queen of Scots was:",a:["Executed in 1587 after years of imprisonment in England","Crowned Queen of England","Married to Henry VIII","A Tudor daughter of Elizabeth I"],k:0,e:"A Catholic claimant to the English throne, she fled to England, was held prisoner and eventually executed on Elizabeth I's orders."},
{c:3,t:"Stuarts",q:"What happened when Elizabeth I died in 1603?",a:["James VI of Scotland also became James I of England","Parliament abolished the monarchy","Spain took the throne","Her son became king"],k:0,e:"The Union of the Crowns joined the two kingdoms under one monarch, though they kept separate parliaments for another century."},
{c:3,t:"Stuarts",q:"What was the Gunpowder Plot of 1605?",a:["A failed Catholic plot to blow up the Houses of Parliament","A plan to burn London","A Scottish rebellion","A plot to poison the king's food"],k:0,e:"Guy Fawkes was caught guarding the explosives; the failure is still marked with bonfires and fireworks on 5 November."},
{c:3,t:"Stuarts",q:"In the English Civil War, supporters of the king were known as:",a:["Cavaliers","Roundheads","Chartists","Levellers"],k:0,e:"Parliament's supporters were called Roundheads; war broke out in 1642."},
{c:3,t:"Stuarts",q:"What happened to Charles I in 1649?",a:["He was executed and England became a republic","He fled to France and lived in exile","He was crowned king of Scotland","He signed Magna Carta"],k:0,e:"After his execution, England was governed as a republic, with Oliver Cromwell later ruling as Lord Protector."},
{c:3,t:"Stuarts",q:"What is the Restoration of 1660?",a:["The return of the monarchy under Charles II","The rebuilding of London after the fire","The restoration of Catholic worship","The reopening of Parliament after the plague"],k:0,e:"Parliament invited Charles II back from exile after Cromwell's death and the collapse of the Protectorate."},
{c:3,t:"Stuarts",q:"Which two disasters struck London in 1665 and 1666?",a:["The Great Plague and the Great Fire","Two earthquakes","A flood and an invasion","Two civil wars"],k:0,e:"The Great Fire destroyed much of the medieval city; Sir Christopher Wren rebuilt St Paul's Cathedral afterwards."},
{c:3,t:"Stuarts",q:"What did the Habeas Corpus Act of 1679 guarantee?",a:["That nobody could be held unlawfully without trial","Free schooling for children","The right to own land","Freedom of the press"],k:0,e:"It remains a key protection against arbitrary imprisonment."},
{c:3,t:"Stuarts",q:"What was the Glorious Revolution of 1688?",a:["William of Orange took the throne without a battle in England, and Parliament's power grew","A Scottish uprising against England","A revolt of farm workers","The founding of the Church of England"],k:0,e:"The Bill of Rights of 1689 followed, confirming that the monarch must rule through Parliament — the basis of constitutional monarchy."},
{c:3,t:"Union",q:"What did the Act of Union of 1707 create?",a:["The Kingdom of Great Britain, with one parliament at Westminster","The United Kingdom including Ireland","The Commonwealth","The Church of Scotland"],k:0,e:"Scotland and England were joined politically, though Scotland kept its own legal and education systems."},
{c:3,t:"Union",q:"What happened at the Battle of Culloden in 1746?",a:["The Jacobite rising led by Bonnie Prince Charlie was crushed","Scotland gained independence","The Vikings were defeated","Napoleon was beaten"],k:0,e:"Defeat was followed by the suppression of Highland culture and, later, the Highland Clearances."},
{c:3,t:"Georgians",q:"Who is generally regarded as the first Prime Minister of Great Britain?",a:["Sir Robert Walpole, from 1721","William Pitt","Winston Churchill","Oliver Cromwell"],k:0,e:"Walpole was the leading minister for over 20 years, and the role gradually developed into what we now call Prime Minister."},
{c:3,t:"Empire & slavery",q:"In which year was the slave trade abolished throughout the British Empire?",a:["1807","1833","1776","1900"],k:0,e:"The trade in slaves was abolished in 1807; the Emancipation Act of 1833 then abolished slavery itself across the Empire."},
{c:3,t:"Empire & slavery",q:"Which campaigner is best known for leading the parliamentary fight against the slave trade?",a:["William Wilberforce","William Wordsworth","William Blake","William Beveridge"],k:0,e:"Wilberforce worked with the Quakers and other abolitionists over many years to change the law."},
{c:3,t:"Empire & slavery",q:"What happened to Britain's American colonies in 1776?",a:["Thirteen colonies declared their independence","They were sold to France","They joined the Empire","They were given self-government within the Empire"],k:0,e:"The Declaration of Independence was followed by war, and Britain recognised the new United States in 1783."},
{c:3,t:"Industry",q:"What was the Industrial Revolution?",a:["The rapid growth of machine-based industry, mining and factories from the 18th century","A political uprising against the king","A movement of artists and writers","The invention of farming"],k:0,e:"Steam power, coal, iron and textiles transformed Britain into the first industrialised nation, drawing people into fast-growing cities."},
{c:3,t:"Industry",q:"James Watt is remembered for:",a:["Improving the steam engine","Discovering penicillin","Building the first railway carriage","Inventing the telephone"],k:0,e:"Watt, a Scot, made steam engines efficient enough to power factories, mines and later transport."},
{c:3,t:"Industry",q:"Richard Arkwright is associated with which industry?",a:["Textiles — he made spinning efficient and organised factory production","Shipbuilding","Coal mining","Steel making"],k:0,e:"Arkwright's mills are seen as a model for the modern factory."},
{c:3,t:"Napoleonic wars",q:"Who commanded the British fleet at the Battle of Trafalgar in 1805?",a:["Admiral Lord Nelson","The Duke of Wellington","Sir Francis Drake","Captain Cook"],k:0,e:"Nelson died in the battle; his flagship HMS Victory can be visited in Portsmouth and Nelson's Column stands in Trafalgar Square."},
{c:3,t:"Napoleonic wars",q:"Who led the allied armies that defeated Napoleon at Waterloo in 1815?",a:["The Duke of Wellington","Lord Nelson","Sir Robert Peel","William Pitt"],k:0,e:"Wellington was known as the Iron Duke and later served as Prime Minister."},
{c:3,t:"Victorians",q:"How long did Queen Victoria reign?",a:["From 1837 to 1901 — more than 60 years","From 1801 to 1837","From 1860 to 1880","From 1900 to 1950"],k:0,e:"During her reign Britain's empire, industry and population expanded enormously."},
{c:3,t:"Victorians",q:"What was the Great Exhibition of 1851?",a:["An exhibition of industry and culture held in the Crystal Palace in Hyde Park","A royal wedding","An art auction","A farming show in Scotland"],k:0,e:"It showcased goods from Britain and around the world and celebrated industrial achievement."},
{c:3,t:"Victorians",q:"Isambard Kingdom Brunel is famous for designing:",a:["Railways, bridges, tunnels and steamships","Hospitals and schools","Aircraft","Cotton mills"],k:0,e:"His works include the Great Western Railway, the Clifton Suspension Bridge and pioneering iron steamships."},
{c:3,t:"Victorians",q:"Florence Nightingale is best known for:",a:["Founding modern nursing after her work in the Crimean War","Discovering vaccines","Leading the suffragettes","Writing novels about the poor"],k:0,e:"She opened a nurses' training school at St Thomas' Hospital in London in 1860."},
{c:3,t:"Victorians",q:"Who was Mary Seacole?",a:["A nurse from Jamaica who cared for wounded soldiers in the Crimean War","A Victorian novelist","The first woman MP","A suffragette leader"],k:0,e:"She funded her own journey and set up a hotel near the front line to treat the sick and wounded."},
{c:3,t:"Suffrage",q:"What did the Reform Act of 1832 do?",a:["It extended the vote and abolished many corrupt 'rotten borough' seats","It gave women the vote","It abolished the House of Lords","It created the NHS"],k:0,e:"Further reform acts through the century gradually widened the franchise among men."},
{c:3,t:"Suffrage",q:"Who founded the Women's Social and Political Union in 1903?",a:["Emmeline Pankhurst","Florence Nightingale","Margaret Thatcher","Nancy Astor"],k:0,e:"Its members, known as suffragettes, campaigned — sometimes militantly — for votes for women."},
{c:3,t:"Suffrage",q:"In which year did women in the UK get the vote on the same terms as men?",a:["1928, at the age of 21","1918","1945","1969"],k:0,e:"In 1918 women over 30 who met a property qualification could vote; equality at 21 followed in 1928."},
{c:3,t:"World wars",q:"When did the First World War take place?",a:["1914 to 1918","1939 to 1945","1899 to 1902","1900 to 1910"],k:0,e:"The war began after the assassination of Archduke Franz Ferdinand and ended with the armistice on 11 November 1918."},
{c:3,t:"World wars",q:"The Battle of the Somme in 1916 is remembered for:",a:["Enormous British casualties, with around 60,000 on the first day","A quick British victory","A naval engagement","The first use of the atom bomb"],k:0,e:"It came to symbolise the terrible cost of trench warfare on the Western Front."},
{c:3,t:"World wars",q:"Who became Prime Minister in 1940 and led Britain through the Second World War?",a:["Winston Churchill","Neville Chamberlain","Clement Attlee","David Lloyd George"],k:0,e:"Churchill's wartime speeches are among the most famous in British history; he was voted out in 1945 and returned in 1951."},
{c:3,t:"World wars",q:"What was the evacuation of Dunkirk in 1940?",a:["The rescue of British and allied troops from France by naval and civilian boats","An invasion of Germany","A bombing raid on London","The surrender of France"],k:0,e:"Hundreds of small civilian craft joined the naval effort, and over 300,000 troops were brought home."},
{c:3,t:"World wars",q:"What was the Battle of Britain?",a:["The air battle in 1940 in which the RAF stopped German plans to invade","A tank battle in North Africa","A sea battle in the Atlantic","A land battle in Normandy"],k:0,e:"Churchill's tribute to the pilots — 'never was so much owed by so many to so few' — became famous."},
{c:3,t:"World wars",q:"What happened on 6 June 1944?",a:["D-Day: allied forces landed in Normandy","Germany invaded Poland","The Blitz began","Japan surrendered"],k:0,e:"The Normandy landings opened the campaign that liberated western Europe."},
{c:3,t:"World wars",q:"What is VE Day and when is it marked?",a:["Victory in Europe Day, 8 May 1945","Victory in Europe Day, 11 November","Veterans Day, 1 January","Victory Day, 4 July"],k:0,e:"The war with Japan ended in August 1945 after atomic bombs were dropped on Hiroshima and Nagasaki."},
{c:3,t:"Post-war",q:"Which report of 1942 laid the foundations of the modern welfare state?",a:["The Beveridge Report","The Domesday Book","The Bevan Report","The Attlee Plan"],k:0,e:"William Beveridge identified 'five giants' to be defeated, leading to social security reform after the war."},
{c:3,t:"Post-war",q:"Who was the Health Secretary who led the creation of the National Health Service in 1948?",a:["Aneurin Bevan","William Beveridge","Clement Attlee","Winston Churchill"],k:0,e:"The NHS was founded on the principle of healthcare free at the point of use, based on need rather than ability to pay."},
{c:3,t:"Post-war",q:"What was the significance of the ship Empire Windrush in 1948?",a:["It brought workers from the Caribbean who helped rebuild post-war Britain","It was sunk in the war","It carried troops to Normandy","It was the first steam-powered liner"],k:0,e:"Post-war labour shortages led to recruitment from the Caribbean and later from India, Pakistan and elsewhere."},
{c:3,t:"Post-war",q:"In which year did India and Pakistan become independent?",a:["1947","1921","1960","1973"],k:0,e:"Independence for India and Pakistan began a rapid process of decolonisation across the British Empire."},
{c:3,t:"Post-war",q:"What replaced the British Empire as a voluntary association of countries?",a:["The Commonwealth","The European Union","NATO","The United Nations"],k:0,e:"Membership is voluntary and carries no legal obligation, but members share values such as democracy and the rule of law."},
{c:3,t:"Modern",q:"Who became the UK's first woman Prime Minister, in 1979?",a:["Margaret Thatcher","Theresa May","Nancy Astor","Barbara Castle"],k:0,e:"She led the Conservative government until 1990, a period of privatisation and major economic change."},
{c:3,t:"Modern",q:"The Good Friday Agreement of 1998 concerned:",a:["Peace and power-sharing in Northern Ireland","Trade with Europe","Scottish independence","Reform of the House of Lords"],k:0,e:"It led to the Northern Ireland Assembly and helped bring an end to the period known as the Troubles."},
{c:3,t:"Modern",q:"When did devolved government begin in Scotland and Wales?",a:["1999, after referendums held in 1997","1979","1922","2016"],k:0,e:"The Scottish Parliament and the Welsh Assembly, now the Senedd, first met in 1999."},
{c:3,t:"Modern",q:"When did the UK leave the European Union?",a:["31 January 2020, after a referendum in 2016","1973","2010","It has not left"],k:0,e:"The UK joined the European Economic Community in 1973 and left the EU in 2020 following the 2016 referendum."},
{c:3,t:"Modern",q:"What was the outcome of the Falklands conflict of 1982?",a:["British forces retook the islands after an Argentine invasion","Argentina kept the islands","The islands became independent","The UN took control"],k:0,e:"The islands remain a British overseas territory."},
{c:3,t:"Science",q:"Sir Isaac Newton is famous for:",a:["Describing gravity and the laws of motion","Discovering penicillin","Inventing the steam engine","Splitting the atom"],k:0,e:"His Principia Mathematica is one of the most influential scientific works ever published."},
{c:3,t:"Science",q:"Which naturalist developed the theory of evolution in 'On the Origin of Species'?",a:["Charles Darwin","Charles Dickens","Michael Faraday","Ernest Rutherford"],k:0,e:"Darwin published his theory of evolution by natural selection in 1859."},
{c:3,t:"Science",q:"Who discovered penicillin in 1928?",a:["Alexander Fleming","Edward Jenner","Joseph Lister","Robert Watson-Watt"],k:0,e:"Fleming, a Scot, noticed mould killing bacteria; penicillin went on to save millions of lives."},
{c:3,t:"Science",q:"Sir Tim Berners-Lee is credited with inventing:",a:["The World Wide Web","The television","The jet engine","The telephone"],k:0,e:"He developed the web around 1990, allowing information to be shared across the internet through websites and links."},
{c:3,t:"Science",q:"Who was Alan Turing?",a:["A mathematician who helped break wartime codes and pioneered computing","A Victorian engineer","A Tudor explorer","A wartime pilot"],k:0,e:"His work at Bletchley Park shortened the Second World War, and his ideas underpin modern computer science."},
{c:3,t:"Science",q:"John Logie Baird is remembered for:",a:["Demonstrating the first working television","Discovering radar","Inventing the hovercraft","Developing the jet engine"],k:0,e:"Baird, a Scot, gave the first public demonstration of television in the 1920s."},
{c:3,t:"Science",q:"Who was Ada Lovelace?",a:["A mathematician regarded as writing the first computer programme","A wartime nurse","A suffragette leader","The first female MP"],k:0,e:"Working with Charles Babbage's Analytical Engine, she described how a machine could be instructed to calculate."},
{c:3,t:"Science",q:"Dolly the sheep, born in 1996 at the Roslin Institute near Edinburgh, was:",a:["The first mammal cloned from an adult cell","The first sheep bred for wool","A record-breaking racing animal","A television star"],k:0,e:"Dolly's birth was a landmark in genetics and stem cell research."},
{c:3,t:"Science",q:"Which scientists, working in Britain, announced the structure of DNA in 1953?",a:["Crick and Watson, with work by Franklin and Wilkins","Newton and Halley","Darwin and Wallace","Fleming and Florey"],k:0,e:"The discovery of the double helix at Cambridge transformed biology and medicine."},
{c:3,t:"Science",q:"Sir Frank Whittle is known for developing:",a:["The jet engine","The radio","Radar","The first computer"],k:0,e:"His turbojet engine, patented in the 1930s, changed air travel permanently."},
{c:3,t:"Science",q:"The world's first test-tube baby, Louise Brown, was born in Britain in:",a:["1978","1953","1990","1962"],k:0,e:"The IVF technique was developed by Patrick Steptoe and Robert Edwards."},
/* ===== CHAPTER 4 — A MODERN, THRIVING SOCIETY ===== */
{c:4,t:"Religion",q:"What is the established Church of England?",a:["The Anglican Church, with the monarch as its Supreme Governor","The Roman Catholic Church","The Presbyterian Church","The Methodist Church"],k:0,e:"The Archbishop of Canterbury is its spiritual leader, and some Church of England bishops sit in the House of Lords."},
{c:4,t:"Religion",q:"What is the national Church of Scotland?",a:["A Presbyterian church, led by an elected Moderator","An Anglican church led by an archbishop","A Roman Catholic church","There is no national church in Scotland"],k:0,e:"The Church of Scotland's General Assembly elects a Moderator each year as its chairperson."},
{c:4,t:"Patron saints",q:"When is St George's Day, the patron saint's day of England?",a:["23 April","1 March","17 March","30 November"],k:0,e:"St David (Wales) 1 March, St Patrick (Northern Ireland) 17 March, St George (England) 23 April, St Andrew (Scotland) 30 November."},
{c:4,t:"Patron saints",q:"Who is the patron saint of Scotland and when is the day marked?",a:["St Andrew, on 30 November","St David, on 1 March","St Patrick, on 17 March","St George, on 23 April"],k:0,e:"St Andrew's Day is a bank holiday in Scotland."},
{c:4,t:"Patron saints",q:"Which patron saint's day falls on 1 March?",a:["St David, patron saint of Wales","St Patrick","St George","St Andrew"],k:0,e:"The daffodil and the leek are both Welsh emblems worn on St David's Day."},
{c:4,t:"Festivals",q:"What is celebrated on 5 November each year?",a:["Bonfire Night, marking the failure of the Gunpowder Plot of 1605","The end of the First World War","The Queen's birthday","The start of the harvest"],k:0,e:"Fireworks and bonfires recall the discovery of the plot to blow up Parliament."},
{c:4,t:"Festivals",q:"What happens on Remembrance Day, 11 November?",a:["People wear poppies and observe a two-minute silence at 11am","Children go trick-or-treating","Families exchange gifts","Fireworks are set off"],k:0,e:"It marks the armistice that ended the First World War in 1918 and remembers those who died in conflict."},
{c:4,t:"Festivals",q:"What is Hogmanay?",a:["The Scottish celebration of New Year's Eve","A Welsh harvest festival","An Irish saint's day","An English spring fair"],k:0,e:"In Scotland, 2 January is also a bank holiday."},
{c:4,t:"Festivals",q:"What is Boxing Day?",a:["26 December, the day after Christmas Day","The first Monday in January","A sporting event in March","The day before Christmas Eve"],k:0,e:"It is a public holiday across the UK and a popular day for sport and sales."},
{c:4,t:"Festivals",q:"Which of these is a major Hindu festival celebrated in the UK?",a:["Diwali, the festival of lights","Eid al-Fitr","Hanukkah","Vaisakhi"],k:0,e:"Diwali is celebrated by Hindus and Sikhs; Eid is Muslim, Hanukkah Jewish and Vaisakhi a Sikh festival."},
{c:4,t:"Festivals",q:"What do Muslims in the UK celebrate at Eid al-Fitr?",a:["The end of Ramadan, the month of fasting","The Sikh new year","The birth of Christ","The harvest"],k:0,e:"Eid ul Adha, later in the year, remembers the willingness of Ibrahim to sacrifice his son."},
{c:4,t:"Festivals",q:"Burns Night, on 25 January, celebrates:",a:["The Scottish poet Robert Burns","The end of winter","A Welsh musician","A Northern Irish saint"],k:0,e:"Suppers include haggis, poetry and the song 'Auld Lang Syne', written by Burns and sung at New Year."},
{c:4,t:"Sport",q:"What is 'the Ashes'?",a:["A cricket series between England and Australia","A rugby tournament","A horse race at Aintree","A golf championship"],k:0,e:"Cricket originated in England and the Ashes has been contested since the nineteenth century."},
{c:4,t:"Sport",q:"In which year was the Football Association founded in England?",a:["1863","1900","1946","1789"],k:0,e:"The FA drew up the first formal rules; each of the UK's nations has its own football association and national team."},
{c:4,t:"Sport",q:"Which rugby union tournament involves England, Scotland, Wales, Ireland, France and Italy?",a:["The Six Nations Championship","The Ashes","The Premier League","The Grand National"],k:0,e:"Northern Ireland plays as part of the all-Ireland team in rugby union."},
{c:4,t:"Sport",q:"Where is the world's oldest tennis tournament held each year?",a:["Wimbledon, in London","St Andrews, in Scotland","Lord's, in London","Aintree, near Liverpool"],k:0,e:"The Wimbledon Championships began in 1877 and remain the only Grand Slam played on grass."},
{c:4,t:"Sport",q:"Which town in Scotland is regarded as the home of golf?",a:["St Andrews","Stirling","Inverness","Dundee"],k:0,e:"The Royal and Ancient Golf Club of St Andrews was founded there in 1754."},
{c:4,t:"Sport",q:"How many times has London hosted the Olympic Games?",a:["Three — in 1908, 1948 and 2012","Once, in 2012","Twice, in 1948 and 2012","Never"],k:0,e:"London is the only city to have hosted the modern Summer Olympics three times."},
{c:4,t:"Sport",q:"Who organised games for injured servicemen that grew into the Paralympic Games?",a:["Dr Ludwig Guttmann, at Stoke Mandeville Hospital","Sir Roger Bannister","Baron de Coubertin","Sir Steve Redgrave"],k:0,e:"The 1948 Stoke Mandeville Games were the forerunner of the modern Paralympics."},
{c:4,t:"Sport",q:"Sir Roger Bannister was the first person to:",a:["Run a mile in under four minutes, in 1954","Win five Olympic gold medals","Sail around the world alone","Climb Everest"],k:0,e:"He achieved it at Oxford and later became a distinguished neurologist."},
{c:4,t:"Sport",q:"Which famous horse race is held at Aintree, near Liverpool?",a:["The Grand National","The Derby","Royal Ascot","The Open"],k:0,e:"Horse racing has a long royal association; Royal Ascot is a fixture of the social calendar."},
{c:4,t:"Music",q:"What are 'the Proms'?",a:["An eight-week summer season of classical concerts, mostly at the Royal Albert Hall","A pop music award show","A folk dance festival in Wales","An opera company in Glasgow"],k:0,e:"The Last Night of the Proms is a well-known celebration of British classical tradition."},
{c:4,t:"Music",q:"Which of these composers wrote the 'Pomp and Circumstance' marches?",a:["Sir Edward Elgar","Benjamin Britten","Gustav Holst","Henry Purcell"],k:0,e:"Elgar's music, including the Enigma Variations, is closely associated with British ceremonial occasions."},
{c:4,t:"Music",q:"The Mercury Music Prize is awarded for:",a:["The best album from the UK and Ireland each year","The best classical performance","Lifetime achievement in jazz","The best film score"],k:0,e:"The Brit Awards are the other major annual British popular music awards."},
{c:4,t:"Theatre",q:"Where is the Edinburgh Festival Fringe held and when?",a:["In Edinburgh, every August","In Glasgow, every spring","In London, at Christmas","In Cardiff, in June"],k:0,e:"It is the largest arts festival of its kind in the world, showcasing theatre, comedy and music."},
{c:4,t:"Theatre",q:"What is a pantomime?",a:["A comic musical play for families, usually staged around Christmas","A silent film genre","A type of opera","A Shakespearean tragedy"],k:0,e:"Pantomimes use fairy tale plots, audience participation and traditions such as the male 'dame' played by a man."},
{c:4,t:"Theatre",q:"The Laurence Olivier Awards are given for excellence in:",a:["London theatre","British cinema","Television drama","Popular music"],k:0,e:"They are named after the actor and director Sir Laurence Olivier."},
{c:4,t:"Literature",q:"Which prize is the UK's best-known award for fiction?",a:["The Booker Prize","The Turner Prize","The Mercury Prize","The BAFTA"],k:0,e:"The Turner Prize is for visual art, the Mercury for music and BAFTAs for film and television."},
{c:4,t:"Literature",q:"Geoffrey Chaucer is best known for writing:",a:["The Canterbury Tales","Paradise Lost","Pride and Prejudice","Oliver Twist"],k:0,e:"Written in the fourteenth century, it tells the stories of pilgrims travelling to Canterbury."},
{c:4,t:"Literature",q:"Which novelist wrote 'Pride and Prejudice' and 'Sense and Sensibility'?",a:["Jane Austen","Charlotte Brontë","George Eliot","Agatha Christie"],k:0,e:"Austen's novels examine marriage, money and class in Georgian England."},
{c:4,t:"Literature",q:"Charles Dickens is known for novels such as:",a:["Oliver Twist and Great Expectations","Wuthering Heights and Jane Eyre","Murder on the Orient Express","Under Milk Wood"],k:0,e:"Dickens drew attention to poverty and injustice in Victorian Britain; many of his characters remain household names."},
{c:4,t:"Literature",q:"Who is the Poet Laureate?",a:["A poet appointed to an honorary royal role, expected to mark national occasions","The head of the Arts Council","The winner of the Booker Prize","A poet elected by the public each year"],k:0,e:"The post dates back to the seventeenth century and is now held for a fixed term."},
{c:4,t:"Literature",q:"Dylan Thomas was a celebrated poet from which part of the UK?",a:["Wales","Scotland","Northern Ireland","Cornwall"],k:0,e:"His works include the radio play 'Under Milk Wood'."},
{c:4,t:"Art",q:"Which English painter is famous for 'The Hay Wain'?",a:["John Constable","J M W Turner","Thomas Gainsborough","David Hockney"],k:0,e:"Constable painted the countryside of Suffolk; the Turner Prize is named after his contemporary J M W Turner."},
{c:4,t:"Art",q:"The Turner Prize is awarded each year for:",a:["Contemporary visual art","Landscape painting only","Architecture","Poetry"],k:0,e:"It has been won by artists including Damien Hirst and Anish Kapoor and often provokes public debate."},
{c:4,t:"Art",q:"Sir Henry Moore and Dame Barbara Hepworth are known as:",a:["Sculptors","Portrait painters","Architects","Photographers"],k:0,e:"Both were leading figures in twentieth-century British sculpture."},
{c:4,t:"Architecture",q:"Who designed St Paul's Cathedral after the Great Fire of London?",a:["Sir Christopher Wren","Robert Adam","Sir Norman Foster","Capability Brown"],k:0,e:"Wren rebuilt many London churches after 1666; St Paul's remains his masterpiece."},
{c:4,t:"Architecture",q:"Lancelot 'Capability' Brown is famous for designing:",a:["Landscaped gardens and parkland around country houses","Cathedrals","Railway stations","City squares in Edinburgh"],k:0,e:"His naturalistic landscapes surround many great houses and are a distinctive British contribution to garden design."},
{c:4,t:"Film",q:"Sir Alfred Hitchcock was a British director best known for:",a:["Suspense and thriller films such as Psycho and The Birds","Silent comedies","Nature documentaries","Historical epics about Rome"],k:0,e:"He began his career in Britain before moving to Hollywood."},
{c:4,t:"Film",q:"Nick Park created which animated characters?",a:["Wallace and Gromit","Paddington Bear","James Bond","Mr Bean"],k:0,e:"His Aardman Animations films have won multiple Academy Awards."},
{c:4,t:"Media",q:"What is the BBC?",a:["A public service broadcaster funded mainly by the TV licence fee","A commercial channel funded by adverts","A newspaper group","A government department"],k:0,e:"Founded in 1922, the BBC is independent of government despite its public funding."},
{c:4,t:"Media",q:"Do you need a TV licence to watch live television in the UK?",a:["Yes — one licence covers a household","No, television is free","Only for satellite channels","Only if you own more than one set"],k:0,e:"A licence is needed to watch or record live TV on any channel or to use BBC iPlayer; people aged 75 and over may qualify for help."},
{c:4,t:"Landmarks",q:"Where is the Giant's Causeway?",a:["On the north-east coast of Northern Ireland","On the west coast of Wales","In the Scottish Highlands","In Cornwall"],k:0,e:"Its columns of volcanic rock are linked in legend to the giant Finn McCool."},
{c:4,t:"Landmarks",q:"What is Snowdonia?",a:["A national park and mountain range in Wales","A Scottish loch","A Northern Irish coastline","A moorland in Devon"],k:0,e:"Snowdon, its highest peak, is the tallest mountain in Wales."},
{c:4,t:"Landmarks",q:"What is the highest mountain in the UK?",a:["Ben Nevis, in Scotland","Scafell Pike, in England","Snowdon, in Wales","Slieve Donard, in Northern Ireland"],k:0,e:"Scafell Pike is the highest in England and Snowdon the highest in Wales."},
{c:4,t:"Landmarks",q:"The Eden Project, with its huge biomes of plants, is in:",a:["Cornwall","Kent","Fife","County Down"],k:0,e:"Its domes house plants from many different climates and it is a major visitor attraction."},
{c:4,t:"Landmarks",q:"What is the Tower of London famous for?",a:["Its Norman origins, the Crown Jewels and the Yeomen Warders","Being the seat of Parliament","Housing the National Gallery","Being a royal residence today"],k:0,e:"The guards are nicknamed Beefeaters and the ravens kept there are part of its legend."},
{c:4,t:"Money",q:"What is the currency of the UK?",a:["The pound sterling, divided into 100 pence","The euro","The dollar","The crown"],k:0,e:"Scotland and Northern Ireland can issue their own banknotes, which are valid across the UK although not always accepted everywhere."},
{c:4,t:"Flags",q:"Which crosses make up the Union Flag?",a:["The crosses of St George, St Andrew and St Patrick","The crosses of St David and St George only","Four crosses, one per nation","A single cross of St George"],k:0,e:"Wales is not represented because it was already united with England when the flag was first created."},
{c:4,t:"Customs",q:"At what age can you legally buy alcohol in a UK pub or shop?",a:["18","16","21","There is no legal age"],k:0,e:"Someone aged 16 or 17 may drink beer, wine or cider with a meal in some settings if accompanied by an adult, but cannot buy it."},
{c:4,t:"Customs",q:"Which of these is considered polite behaviour in the UK?",a:["Waiting your turn in a queue","Pushing to the front if you are in a hurry","Ignoring people who serve you","Arriving late without notice"],k:0,e:"Queuing, saying please and thank you, and apologising for small accidents are strong social customs."},

/* ===== CHAPTER 5 — GOVERNMENT, THE LAW AND YOUR ROLE ===== */
{c:5,t:"Monarchy",q:"What kind of state is the UK?",a:["A constitutional monarchy with a parliamentary democracy","An absolute monarchy","A federal republic","A one-party state"],k:0,e:"The monarch is head of state but does not make political decisions; government is carried out by an elected Parliament."},
{c:5,t:"Monarchy",q:"What is the monarch's role in relation to new laws?",a:["To give Royal Assent, a formal approval, to bills passed by Parliament","To write the laws personally","To veto laws they dislike","To decide which laws Parliament debates"],k:0,e:"The monarch's role is ceremonial and by convention Royal Assent is always given."},
{c:5,t:"Monarchy",q:"Who is the head of state of the UK today?",a:["King Charles III","The Prime Minister","The Speaker of the House of Commons","The Lord Chancellor"],k:0,e:"Charles III became King in September 2022 on the death of Queen Elizabeth II, who had reigned for 70 years."},
{c:5,t:"Parliament",q:"How many Members of Parliament sit in the House of Commons?",a:["650","100","300","1,200"],k:0,e:"Each MP represents a constituency and is elected using the first past the post system."},
{c:5,t:"Parliament",q:"How are members of the House of Lords usually appointed?",a:["Most are life peers nominated for their contribution to public life","They are all elected by the public","They inherit their seats without exception","They are chosen by the House of Commons"],k:0,e:"The Lords also includes some hereditary peers and senior Church of England bishops."},
{c:5,t:"Parliament",q:"What is the main job of the House of Lords?",a:["To scrutinise, revise and sometimes delay legislation from the Commons","To elect the Prime Minister","To collect taxes","To run the civil service"],k:0,e:"The Commons is the more powerful chamber because it is elected; the Lords can suggest amendments but rarely blocks it outright."},
{c:5,t:"Parliament",q:"How often must a UK general election be held, at a minimum?",a:["At least every five years","Every two years","Every ten years","Whenever the monarch decides"],k:0,e:"An election may be called sooner; a by-election is held if a single seat becomes vacant."},
{c:5,t:"Parliament",q:"What voting system is used to elect MPs to the House of Commons?",a:["First past the post — the candidate with the most votes in each constituency wins","Proportional representation","A single transferable vote","A national party list"],k:0,e:"Devolved and some local elections use different, more proportional systems."},
{c:5,t:"Parliament",q:"What is the role of the Speaker of the House of Commons?",a:["To chair debates impartially and keep order","To lead the largest party","To advise the monarch","To write the budget"],k:0,e:"The Speaker is an MP elected by fellow MPs in a secret ballot and must be politically neutral."},
{c:5,t:"Parliament",q:"What is the 'opposition'?",a:["The largest party not in government, which challenges and scrutinises ministers","A group of civil servants","Members of the House of Lords","A pressure group outside Parliament"],k:0,e:"Its leader appoints a Shadow Cabinet to shadow each government department."},
{c:5,t:"Parliament",q:"What do party whips do?",a:["Organise MPs and make sure they attend and vote as the party wishes","Record debates for the public","Advise the monarch","Count election results"],k:0,e:"Whips are MPs appointed by each party to maintain discipline."},
{c:5,t:"Parliament",q:"Where can you read a record of what is said in Parliament?",a:["In Hansard, the official published report","In the party manifestos","Only in newspapers","Nowhere — debates are private"],k:0,e:"Debates are also broadcast and Parliament's proceedings are open to the public."},
{c:5,t:"Government",q:"Who appoints the Prime Minister?",a:["The monarch, inviting the leader who can command a majority in the Commons","The House of Lords","The Supreme Court","A public vote for the individual"],k:0,e:"Voters elect MPs, not the Prime Minister directly."},
{c:5,t:"Government",q:"Where is the Prime Minister's official residence?",a:["10 Downing Street, London","Buckingham Palace","The Palace of Westminster","Chequers only"],k:0,e:"The Prime Minister also has a country house, Chequers; the Chancellor lives at 11 Downing Street."},
{c:5,t:"Government",q:"Who is the Chancellor of the Exchequer?",a:["The minister responsible for the economy and public finances","The head of the judiciary","The monarch's private secretary","The leader of the House of Lords"],k:0,e:"Other senior posts include the Home Secretary and the Foreign Secretary."},
{c:5,t:"Government",q:"What is the civil service?",a:["Politically neutral officials who deliver government policy whichever party is in power","Elected representatives in local councils","Members of the armed forces","Judges and magistrates"],k:0,e:"Civil servants are chosen on merit and are expected to serve any government impartially."},
{c:5,t:"Devolution",q:"Where does the Scottish Parliament meet?",a:["Holyrood, in Edinburgh","Stormont, in Belfast","Cardiff Bay","Westminster"],k:0,e:"It has 129 Members of the Scottish Parliament (MSPs), elected by a form of proportional representation."},
{c:5,t:"Devolution",q:"What is the Welsh Parliament called?",a:["The Senedd, or Senedd Cymru","The Assembly of Wales","The Welsh Grand Committee","The Cardiff Council"],k:0,e:"Its members are known as MSs and it can pass laws in devolved areas such as health and education."},
{c:5,t:"Devolution",q:"Where does the Northern Ireland Assembly meet?",a:["Stormont, in Belfast","Holyrood","Westminster","Dublin"],k:0,e:"It operates on a power-sharing basis established by the Good Friday Agreement and has at times been suspended."},
{c:5,t:"Devolution",q:"Which of these is a power normally reserved to the UK Parliament rather than devolved?",a:["Defence and foreign affairs","Health in Scotland","Education in Wales","Local roads in Northern Ireland"],k:0,e:"Reserved matters also include immigration and most tax policy."},
{c:5,t:"Voting",q:"At what age can you vote in a UK general election?",a:["18","16","21","There is no minimum age"],k:0,e:"You can register from 16 (or 14 in Scotland and Wales for devolved elections), and some devolved elections allow voting at 16."},
{c:5,t:"Voting",q:"What must you do before you can vote?",a:["Put your name on the electoral register","Apply for a passport","Pay a voting fee","Join a political party"],k:0,e:"Registration can be done online or through the annual household canvass."},
{c:5,t:"Voting",q:"What is a polling card?",a:["A card telling you where and when to vote","A ballot paper","Proof of party membership","A form for claiming expenses"],k:0,e:"You do not need the card to vote, but in many elections you now need accepted photo ID."},
{c:5,t:"Voting",q:"If you cannot attend in person on polling day, you can:",a:["Apply for a postal or proxy vote","Vote by telephone","Vote the following week","Ask a neighbour to vote informally for you"],k:0,e:"A proxy is someone you trust who is appointed to vote on your behalf."},
{c:5,t:"Taking part",q:"How can you raise a problem with your Member of Parliament?",a:["Write to them or attend their local surgery","Only by contacting the monarch","Only through a solicitor","You cannot contact MPs directly"],k:0,e:"MPs hold regular surgeries in their constituencies; you can also contact councillors or devolved representatives."},
{c:5,t:"Taking part",q:"Which TWO of these are ways of taking part in public life?",a:["Standing for election as a local councillor","Serving on a jury when called","Refusing to pay tax in protest","Ignoring the electoral register"],k:[0,1],e:"Jury service is a civic duty and standing for election is open to most people aged 18 and over."},
{c:5,t:"Taking part",q:"What is a school governor or, in Scotland, a school board member?",a:["A volunteer who helps oversee how a school is run","A paid inspector from the government","A senior teacher","An elected councillor"],k:0,e:"Anyone over 18 can usually apply, and it is a common way of contributing to the local community."},
