{c:5,t:"Law",q:"What is the difference between criminal and civil law?",a:["Criminal law deals with offences against society; civil law settles disputes between people or organisations","There is no difference","Civil law only applies in Scotland","Criminal law only applies to businesses"],k:0,e:"Criminal cases are usually brought by the state; civil cases include debt, housing and employment disputes."},
{c:5,t:"Law",q:"In England, Wales and Northern Ireland, less serious criminal cases are heard in:",a:["Magistrates' courts","The Crown Court","The Sheriff Court","The County Court"],k:0,e:"In Scotland, equivalent cases are heard by Justices of the Peace or in the Sheriff Court."},
{c:5,t:"Law",q:"Serious criminal offences in England and Wales are tried:",a:["In the Crown Court, before a judge and a jury of 12","In a magistrates' court only","By the police","In the County Court"],k:0,e:"A jury in Scotland has 15 members and can return a verdict of not proven as well as guilty or not guilty."},
{c:5,t:"Law",q:"What kind of case is heard in the County Court?",a:["Civil disputes such as debt, personal injury or breach of contract","Murder and robbery","Immigration appeals only","Military discipline"],k:0,e:"Small claims of lower value can be handled in a simpler, cheaper small claims procedure."},
{c:5,t:"Law",q:"Who can you contact for legal advice if you cannot afford a solicitor?",a:["Citizens Advice, a law centre, or you may qualify for legal aid","Only the police","Your MP, who must represent you in court","Nobody — advice must always be paid for"],k:0,e:"Solicitors' firms often give a free first interview, and legal aid is available for some types of case."},
{c:5,t:"Law",q:"Who is responsible for holding police forces in England and Wales to account locally?",a:["Elected Police and Crime Commissioners","The Home Secretary alone","Local magistrates","The Crown Court"],k:0,e:"Police officers must themselves obey the law, and complaints can be made to the force or to an independent body."},
{c:5,t:"Law",q:"Carrying a weapon such as a knife in public without good reason is:",a:["A criminal offence, even if you do not use it","Legal if the blade is short","Allowed for self-defence","Only an offence at night"],k:0,e:"Penalties are severe, and selling knives to people under 18 is also an offence."},
{c:5,t:"Law",q:"Which of these is a crime in the UK?",a:["Female genital mutilation","Wearing religious dress","Speaking a language other than English at home","Owning a television"],k:0,e:"FGM, forced marriage, domestic violence and so-called 'honour' crimes are all serious criminal offences."},
{c:5,t:"Law",q:"What is a hate crime?",a:["A crime motivated by hostility to someone's race, religion, sexuality, disability or gender identity","Any crime committed in anger","A crime committed online","A crime against property"],k:0,e:"Hate crimes are treated more seriously by the courts and should be reported to the police."},
{c:5,t:"Law",q:"How are illegal drugs classified in the UK?",a:["Into Classes A, B and C, with Class A carrying the heaviest penalties","Into groups 1 to 5","They are not classified","By colour coding"],k:0,e:"Possession, production and supply are all offences, with sentences depending on the class and the circumstances."},
{c:5,t:"Rights",q:"The Equality Act protects people from discrimination on grounds including:",a:["Age, disability, race, religion, sex and sexual orientation","Income and postcode","Football team supported","Level of education"],k:0,e:"These are known as protected characteristics and apply at work, in education and in the provision of services."},
{c:5,t:"Rights",q:"Domestic violence in the UK is:",a:["A crime, whoever commits it and whatever the relationship","A private family matter","Only a crime if it causes injury","Only a crime between married couples"],k:0,e:"Help is available from the police and from national helplines and refuges."},
{c:5,t:"Money & work",q:"What is a National Insurance number used for?",a:["To record your contributions and entitlement to benefits and a state pension","As a form of photo ID","To open a bank account only","To register with a doctor"],k:0,e:"You need one to work in the UK, and it is issued to young people before their 16th birthday if they live here."},
{c:5,t:"Money & work",q:"What is PAYE?",a:["Pay As You Earn — income tax and National Insurance deducted by your employer","A savings scheme","A type of pension","A benefit for jobseekers"],k:0,e:"Self-employed people instead pay through Self Assessment, with an online deadline of 31 January."},
{c:5,t:"Money & work",q:"Who must complete a Self Assessment tax return?",a:["People who are self-employed or have income not taxed at source","Everyone who works","Only company directors of large firms","Nobody — tax is always automatic"],k:0,e:"The online return and payment deadline is 31 January following the end of the tax year."},
{c:5,t:"Driving",q:"At what age can you usually apply to drive a car in the UK?",a:["17","16","18","21"],k:0,e:"You can ride a moped at 16, and you must have insurance, a valid licence and, for older vehicles, an MOT certificate."},
{c:5,t:"Driving",q:"When does a car first need an MOT test?",a:["When it is three years old","Every year from new","After five years","Only when it is sold"],k:0,e:"Driving without a valid MOT, insurance or road tax is a criminal offence."},
{c:5,t:"UK & world",q:"How many countries are members of the Commonwealth?",a:["Around 56","Around 15","Around 100","Exactly 27"],k:0,e:"Membership is voluntary, the King is its head, and members co-operate on shared goals such as democracy and development."},
{c:5,t:"UK & world",q:"The UK's role at the United Nations includes:",a:["Being one of five permanent members of the Security Council","Holding the presidency permanently","Providing all peacekeeping troops","Setting the budget alone"],k:0,e:"The UN was set up after the Second World War to prevent conflict and promote peace and security."},
{c:5,t:"UK & world",q:"What is NATO?",a:["A defence alliance of European and North American countries","A trade organisation","A United Nations agency for refugees","A European court"],k:0,e:"Members agree to help each other if they come under attack."},
{c:5,t:"UK & world",q:"The Council of Europe is responsible for:",a:["The European Convention on Human Rights","Setting EU trade rules","Running the euro","Commanding allied armed forces"],k:0,e:"It is separate from the European Union and the UK remains a member."},
{c:5,t:"Community",q:"What is jury service?",a:["A duty to sit on a jury and help decide a court case when randomly selected","An optional volunteering scheme","A job you apply for","A role reserved for lawyers"],k:0,e:"People on the electoral register aged 18 to 70 may be called; you must attend unless excused."},
{c:5,t:"Community",q:"Which of these helps protect the environment in everyday life?",a:["Recycling household waste and walking or cycling for short journeys","Leaving taps running","Burning rubbish in the garden","Driving everywhere"],k:0,e:"Looking after the area you live in is one of the responsibilities expected of everyone in the UK."},
/* ---- added: history ---- */
{c:3,t:"Early Britain",q:"Which of these did the Romans bring to Britain?",a:["Roads, towns and public baths","Steam engines","Gothic cathedrals","Windmills"],k:0,e:"Roman roads and towns shaped the map of Britain for centuries after the legions left."},
{c:3,t:"Early Britain",q:"What kind of homes did Bronze Age people in Britain live in?",a:["Roundhouses","Stone castles","Timber-framed manor houses","Terraced houses"],k:0,e:"They buried their dead in round barrows and made tools and ornaments from bronze and gold."},
{c:3,t:"Early Britain",q:"What language family did the people of Iron Age Britain speak?",a:["Celtic languages","Germanic languages","Latin","Slavic languages"],k:0,e:"Related languages were spoken across much of Europe; Welsh and Gaelic descend from this family."},
{c:3,t:"Early Britain",q:"Maiden Castle in Dorset is an example of:",a:["An Iron Age hill fort","A Roman amphitheatre","A Norman keep","A Tudor palace"],k:0,e:"Hill forts were defended settlements built on high ground."},
{c:3,t:"Anglo-Saxons",q:"Where did St Columba found a monastery?",a:["Iona, off the west coast of Scotland","Canterbury","Lindisfarne alone","Dublin"],k:0,e:"He spread Christianity in the north while St Augustine worked in the south from AD 597."},
{c:3,t:"Vikings",q:"What was the Danelaw?",a:["The area of eastern and northern England settled and ruled by Vikings","A tax paid to the king","A set of laws written by Alfred","A Viking longship"],k:0,e:"Viking place names such as those ending in -by and -thorpe survive across that area."},
{c:3,t:"Normans",q:"What language did the Norman ruling class speak after 1066?",a:["Norman French","Latin only","Old Norse","Welsh"],k:0,e:"Norman French words entered English, which is why the language has so many pairs of words for the same idea."},
{c:3,t:"Normans",q:"Did William the Conqueror take control of Scotland and Wales?",a:["No — both remained largely outside Norman control","Yes, he conquered both quickly","He conquered Scotland only","He conquered Wales only"],k:0,e:"Wales was not annexed until 1284 under Edward I, and Scotland remained a separate kingdom until 1707."},
{c:3,t:"Middle Ages",q:"Why did medieval kings call Parliaments?",a:["To take advice and to get agreement for new taxes","To choose the next monarch","To appoint bishops","To command the army"],k:0,e:"Over time these gatherings split into the House of Lords and the House of Commons."},
{c:3,t:"Middle Ages",q:"What was one lasting effect of the Black Death?",a:["A shortage of labour that improved conditions for surviving workers","The end of the monarchy","The founding of the Church of England","The abolition of taxes"],k:0,e:"Wages rose, feudal ties weakened, and a new class of yeoman farmers emerged."},
{c:3,t:"Middle Ages",q:"What was 'the Pale' in Ireland?",a:["The area around Dublin that stayed under English control","A Scottish border fortress","A tax on Irish landowners","A Welsh mountain range"],k:0,e:"English authority in Ireland shrank to this region during the later Middle Ages."},
{c:3,t:"Middle Ages",q:"Which language became the official language of the English court and government by around 1400?",a:["English","Norman French","Latin","Gaelic"],k:0,e:"Chaucer wrote The Canterbury Tales in English at about this time, helping to establish it in literature."},
{c:3,t:"Middle Ages",q:"What were the Crusades?",a:["Medieval wars fought for control of the Holy Land, in which English soldiers took part","Civil wars between English barons","Viking raids on monasteries","Trade voyages to Asia"],k:0,e:"They brought new goods, ideas and words back to Britain as well as conflict."},
{c:3,t:"Tudors",q:"What was the Reformation?",a:["The movement that broke from the authority of the Roman Catholic Church","A reform of Parliament","The rebuilding of London","A change to the calendar"],k:0,e:"Across Europe, Protestants challenged Rome; in England the break was driven by Henry VIII's marriage."},
{c:3,t:"Tudors",q:"Under which monarch was the Book of Common Prayer introduced?",a:["Edward VI","Mary I","Henry VII","James I"],k:0,e:"It set out services in English and is still used in Anglican worship today."},
{c:3,t:"Tudors",q:"For which theatre did Shakespeare's company perform in London?",a:["The Globe","The Old Vic","Covent Garden","The Royal Albert Hall"],k:0,e:"A modern reconstruction of the Globe stands on the south bank of the Thames."},
{c:3,t:"Tudors",q:"Which of these plays was written by William Shakespeare?",a:["Macbeth","The Importance of Being Earnest","Waiting for Godot","Pygmalion"],k:0,e:"His plays include Hamlet, Romeo and Juliet, Macbeth and A Midsummer Night's Dream."},
{c:3,t:"Tudors",q:"Sir Francis Drake is remembered for:",a:["Sailing around the world and fighting the Spanish Armada","Discovering Australia","Founding the East India Company","Inventing the ship's chronometer"],k:0,e:"His ship, the Golden Hind, was one of the first to circumnavigate the globe."},
{c:3,t:"Stuarts",q:"What was the King James Bible?",a:["An English translation of the Bible commissioned by James I","A history of the Stuart kings","A book of Scottish law","A collection of royal letters"],k:0,e:"Published in 1611, it shaped the English language for centuries."},
{c:3,t:"Stuarts",q:"What did the Bill of Rights of 1689 establish?",a:["That Parliament must meet regularly and elections must be free","That everyone could vote","That England would have no monarch","That taxes were abolished"],k:0,e:"It confirmed that the monarch could not rule without Parliament's consent."},
{c:3,t:"Stuarts",q:"Who were the Huguenots?",a:["French Protestants who fled persecution and settled in Britain","Scottish Highland clans","Dutch merchants in London","Irish landowners"],k:0,e:"They brought skills, particularly in weaving and silk, from the late seventeenth century onwards."},
{c:3,t:"Stuarts",q:"What happened at the Battle of the Boyne in 1690?",a:["William III defeated James II in Ireland","The Scots defeated the English","The Spanish invaded Ireland","The Jacobites won a victory"],k:0,e:"The battle is still commemorated by some communities in Northern Ireland today."},
{c:3,t:"Union",q:"What did the Act of Union of 1801 create?",a:["The United Kingdom of Great Britain and Ireland","The Kingdom of Great Britain","The Commonwealth","The Church of Ireland"],k:0,e:"Most of Ireland later left, and from the 1920s the state became the UK of Great Britain and Northern Ireland."},
{c:3,t:"Industry",q:"What were the Highland Clearances?",a:["Landowners evicting tenant farmers, often to make way for sheep","A scheme to plant forests","The building of Highland railways","A campaign against smuggling"],k:0,e:"Many of those cleared emigrated to North America and Australia."},
{c:3,t:"Industry",q:"Why were canals built in eighteenth-century Britain?",a:["To move heavy goods such as coal to factories and ports","To supply drinking water to cities","For pleasure boating","To drain farmland only"],k:0,e:"Canals were later overtaken by the railways as the main way of moving freight."},
{c:3,t:"Industry",q:"Who was Sake Dean Mahomet?",a:["A Bengali entrepreneur who opened Britain's first curry house and introduced shampooing","A Victorian railway engineer","A campaigner against the slave trade","A Scottish inventor"],k:0,e:"He settled in Britain in the eighteenth century and later ran baths in Brighton."},
{c:3,t:"Victorians",q:"Who pioneered vaccination against smallpox?",a:["Edward Jenner","Alexander Fleming","Joseph Lister","Florence Nightingale"],k:0,e:"His work in the late eighteenth century led to the eventual eradication of smallpox worldwide."},
{c:3,t:"Victorians",q:"During which conflict was the Victoria Cross introduced?",a:["The Crimean War","The First World War","The Boer War","The Napoleonic Wars"],k:0,e:"Britain fought alongside France and Turkey against Russia in the 1850s; the VC honours exceptional bravery."},
{c:3,t:"Victorians",q:"At its height, roughly how much of the world's population lived in the British Empire?",a:["About a quarter","About half","About a tenth","About three quarters"],k:0,e:"It was the largest empire the world has seen, and most of its territories are now Commonwealth members."},
{c:3,t:"Suffrage",q:"Who were the Chartists?",a:["Campaigners for working-class representation and voting reform","Early trade union inspectors","Victorian factory owners","A religious movement"],k:0,e:"Their demands, including votes for all men and secret ballots, were mostly achieved later in the century."},
{c:3,t:"World wars",q:"Who was the first woman to take her seat as an MP in the House of Commons?",a:["Nancy Astor, in 1919","Emmeline Pankhurst","Margaret Thatcher","Barbara Castle"],k:0,e:"Women had only won the right to vote and to stand for Parliament the year before."},
{c:3,t:"World wars",q:"What was the Blitz?",a:["Sustained German bombing of British cities during the Second World War","A tank offensive in France","A naval blockade of Germany","The evacuation of children"],k:0,e:"London, Coventry, Liverpool, Glasgow and many other cities were heavily bombed."},
{c:3,t:"World wars",q:"Which countries joined Britain as major allies during the Second World War from 1941?",a:["The United States and the Soviet Union","Spain and Portugal","Sweden and Switzerland","Italy and Japan"],k:0,e:"The alliance was decisive in the defeat of Germany and Japan."},
{c:3,t:"World wars",q:"What was rationing during the Second World War?",a:["Limits on how much food and fuel each person could buy","A tax on luxury goods","A scheme for sharing housing","A ban on foreign travel"],k:0,e:"Ration books continued for some goods for years after the war ended."},
{c:3,t:"Post-war",q:"Who was Prime Minister when the NHS and the welfare state were created?",a:["Clement Attlee","Winston Churchill","Harold Wilson","Neville Chamberlain"],k:0,e:"Attlee's Labour government won the 1945 election and carried out the Beveridge reforms."},
{c:3,t:"Modern",q:"When did the period of conflict known as the Troubles in Northern Ireland begin?",a:["In the late 1960s","In the 1920s","In the 1990s","In 1945"],k:0,e:"It continued for about thirty years until the Good Friday Agreement of 1998."},
{c:3,t:"Modern",q:"In which year did the UK join the European Economic Community?",a:["1973","1957","1992","2004"],k:0,e:"The EEC later became the European Union, which the UK left in 2020."},
{c:3,t:"Science",q:"Who developed radar, which helped detect enemy aircraft?",a:["Sir Robert Watson-Watt","Sir Frank Whittle","Sir Christopher Cockerell","Sir Isaac Newton"],k:0,e:"Radar was crucial to the Battle of Britain in 1940."},
{c:3,t:"Science",q:"Sir Christopher Cockerell invented:",a:["The hovercraft","The jet engine","The television","The telephone"],k:0,e:"It was developed in Britain in the 1950s."},
{c:3,t:"Science",q:"The cash machine, or ATM, was developed in the 1960s by:",a:["James Goodfellow, a Scottish inventor","Alan Turing","John Logie Baird","Tim Berners-Lee"],k:0,e:"He patented the use of a personal identification number with a machine-readable card."},
{c:3,t:"Science",q:"Ernest Rutherford is known for his work on:",a:["Splitting the atom","Evolution","Vaccination","Antiseptics"],k:0,e:"He worked in Britain and is regarded as the father of nuclear physics."},
{c:3,t:"Science",q:"Sir Joseph Lister is remembered for:",a:["Pioneering antiseptic surgery","Discovering penicillin","Inventing the stethoscope","Founding the NHS"],k:0,e:"His use of antiseptics dramatically cut deaths from infection after operations."},
{c:3,t:"Science",q:"Professor Stephen Hawking was a British scientist known for work on:",a:["Black holes and the origins of the universe","Genetics","Vaccines","Steam power"],k:0,e:"His book A Brief History of Time brought cosmology to a wide audience."},
/* ---- added: society ---- */
{c:4,t:"Festivals",q:"Vaisakhi is a festival celebrated by:",a:["Sikhs","Buddhists","Jewish communities","Hindus only"],k:0,e:"It marks the founding of the Khalsa and is celebrated in April."},
{c:4,t:"Festivals",q:"Hanukkah is a festival celebrated by:",a:["Jewish communities","Muslim communities","Sikh communities","Hindu communities"],k:0,e:"Candles are lit over eight days, usually in December."},
{c:4,t:"Festivals",q:"What is Mothering Sunday?",a:["A day honouring mothers, held three weeks before Easter","The first Sunday in May","A bank holiday in June","A harvest festival"],k:0,e:"Father's Day falls on the third Sunday in June."},
{c:4,t:"Festivals",q:"What is the Notting Hill Carnival?",a:["A Caribbean street festival held in London each August","A classical music season","A Scottish new year event","A Welsh poetry competition"],k:0,e:"It is one of the largest street festivals in Europe and reflects Britain's Caribbean communities."},
{c:4,t:"Society",q:"What is the National Trust?",a:["A charity founded in 1895 that preserves historic buildings and countryside","A government department","A political party","A banking institution"],k:0,e:"It is one of many charities that rely on volunteers and members to protect heritage."},
{c:4,t:"Society",q:"Volunteering in the UK means:",a:["Giving your time unpaid to help others or a good cause","Working for the government","Unpaid work required by law","Part-time employment"],k:0,e:"Volunteering is a common way to meet people, gain experience and take part in community life."},
{c:4,t:"Money",q:"Which of these is a UK banknote in general circulation?",a:["£20","£100","£2","£200"],k:0,e:"Notes are £5, £10, £20 and £50; £1 and £2 are coins."},
{c:4,t:"Customs",q:"At what age can you legally place a bet or gamble in the UK?",a:["18","16","21","There is no legal age"],k:0,e:"National Lottery scratchcards and draws also require you to be 18."},
{c:4,t:"Customs",q:"Where is smoking banned in the UK?",a:["In nearly all enclosed public places and workplaces","Only in hospitals","Only on public transport","Nowhere — there is no ban"],k:0,e:"It is also illegal to smoke in a car carrying anyone under 18."},
{c:4,t:"Customs",q:"Using a hand-held mobile phone while driving is:",a:["Illegal, with penalty points and a fine","Allowed at low speeds","Allowed if you are stopped at lights","Only illegal for new drivers"],k:0,e:"You can also be prosecuted for careless driving if you are distracted."},
{c:4,t:"Landmarks",q:"Loch Lomond and the Trossachs is a national park in:",a:["Scotland","Wales","Northern Ireland","England"],k:0,e:"The Lake District is in England, Snowdonia in Wales and the Mourne Mountains in Northern Ireland."},
{c:4,t:"Landmarks",q:"The Broads, an area of rivers and lakes popular with boaters, are in:",a:["Norfolk and Suffolk","Cornwall","The Scottish Borders","County Antrim"],k:0,e:"They are managed as a national park."},
/* ---- added: government and law ---- */
{c:5,t:"Parliament",q:"What is a constituency?",a:["The local area an MP is elected to represent","A committee of the House of Lords","A government department","A local council ward only"],k:0,e:"There are 650 constituencies, each electing one MP."},
{c:5,t:"Parliament",q:"What is a manifesto?",a:["A statement of the policies a party would carry out if elected","A record of parliamentary debates","A legal summons","A list of registered voters"],k:0,e:"Parties publish manifestos before an election so voters can compare their plans."},
{c:5,t:"Government",q:"What is the Cabinet?",a:["The Prime Minister's senior ministers, who meet to take major decisions","All the MPs of the governing party","The staff of Downing Street","A committee of the House of Lords"],k:0,e:"Cabinet ministers usually head a government department such as the Home Office or the Treasury."},
{c:5,t:"Government",q:"Members of the Northern Ireland Assembly are known as:",a:["MLAs","MSPs","MSs","MPs"],k:0,e:"Scotland has MSPs, Wales has MSs and the UK Parliament has MPs."},
{c:5,t:"Government",q:"What is a life peer?",a:["Someone appointed to the House of Lords whose title is not inherited","An MP who has served 20 years","A hereditary landowner","An elected member of the Lords"],k:0,e:"Life peers are nominated for their contribution to public life and cannot pass the title to their children."},
{c:5,t:"Law",q:"Why is the judiciary independent of government?",a:["So that judges can apply the law without political interference","Because judges are elected separately","So judges can write new laws","So the government cannot be taken to court"],k:0,e:"Judges can rule that a public body has acted unlawfully, even when that body is the government."},
{c:5,t:"Law",q:"What number do you call in an emergency in the UK?",a:["999 or 112","101","111","911"],k:0,e:"Use 101 for non-emergency police matters and 111 for urgent but non-emergency health advice."},
{c:5,t:"Law",q:"Which number should you call for urgent medical advice that is not an emergency?",a:["111","999","101","101 or 999"],k:0,e:"NHS 111 can direct you to the right service, including out-of-hours GP care."},
{c:5,t:"Law",q:"If you are arrested, you have the right to:",a:["Free legal advice and to have someone informed","Refuse to give your name in all cases","Leave at any time","Choose which court hears your case"],k:0,e:"You should be told the reason for your arrest and can ask for a duty solicitor."},
{c:5,t:"Taking part",q:"What is a pressure group?",a:["An organisation that campaigns to influence government policy","A committee of MPs","A group of civil servants","A type of local council"],k:0,e:"Charities, trade unions and campaign groups all try to influence decisions, which is a normal part of a free society."},
{c:5,t:"Taking part",q:"Is the press in the UK free to criticise the government?",a:["Yes — a free press is an important part of democracy","No, all reporting must be approved","Only local newspapers may do so","Only during election campaigns"],k:0,e:"The media are free to report and comment, subject to laws such as those on defamation."},
{c:5,t:"Money & work",q:"What happens if you do not pay the tax you owe?",a:["HM Revenue and Customs can charge penalties and take enforcement action","Nothing, as tax is voluntary","Your employer pays it for you","You are automatically deported"],k:0,e:"Deliberate evasion is a criminal offence; if you are struggling, contact HMRC early."},
{c:5,t:"Community",q:"Which TWO of these are things a local council is responsible for?",a:["Collecting household waste","Running local libraries and schools","Setting income tax rates","Commanding the armed forces"],k:[0,1],e:"Councils also handle planning, social care and local roads, funded partly by council tax."}
];
const CHAPTERS=[
{n:1,name:"Values and principles",short:"Values",blurb:"What the UK asks of its residents and citizens.",sections:[
 {id:"1a",title:"The values Britain is built on",body:[
 "The Life in the UK test begins with a simple idea: becoming a permanent resident or citizen means joining a community with shared expectations. Nobody is asked to give up their own culture, language or religion — but everyone is asked to respect the framework that allows very different people to live alongside each other.",
 "Five principles sit at the heart of that framework. <em>Democracy</em> means power rests with representatives the public elects and can remove. The <em>rule of law</em> means the same rules bind everyone, including ministers, police officers and the monarch. <em>Individual liberty</em> means you may believe, say and do as you choose within the law. <em>Tolerance</em> means accepting that others will believe differently from you. <em>Participation in community life</em> means taking some responsibility for the place you live.",
 "These are tested directly, but they also explain the logic behind much of the rest of the syllabus — why Magna Carta matters, why Parliament developed as it did, and why equality law looks the way it does."],
 keys:["<b>Democracy</b> — government by elected representatives","<b>Rule of law</b> — nobody is above the law","<b>Individual liberty</b> — freedom within the law","<b>Tolerance</b> — of different faiths and beliefs","<b>Participation</b> — in community life"]},
 {id:"1b",title:"Rights and responsibilities",body:[
 "Rights in the UK include freedom of belief and religion, freedom of speech, freedom from unfair discrimination, the right to a fair trial, and the right to join in the election of a government.",
 "Responsibilities run alongside them: respect and obey the law, respect the rights of others including their right to their own opinions, treat others with fairness, look after yourself and your family, and look after the area you live in and the environment.",
 "Some duties are legal — paying tax, serving on a jury if called, holding insurance to drive. Others are social expectations rather than laws, like queuing or being a good neighbour. The test asks about both."],
 keys:["Obey the law and respect others' rights","Treat others with fairness","Look after yourself and your family","Look after your area and the environment","Discrimination on grounds such as race, religion, sex, age, disability or sexuality is unlawful"]},
 {id:"1c",title:"The test, the English requirement and the ceremony",body:[
 "Most adults applying for settlement (indefinite leave to remain) or citizenship must satisfy the Knowledge of Language and Life requirement. It has two halves: passing the Life in the UK test, and proving English at B1 speaking and listening — or holding a degree taught in English, or being a national of a majority English-speaking country.",
 "The test itself is 24 multiple-choice questions in 45 minutes, taken on a computer at an approved centre. You need 18 correct to pass. A pass does not expire: if you took it for settlement, you do not take it again for citizenship.",
 "If your citizenship application succeeds, you attend a ceremony, usually arranged by your local council. There you swear or affirm allegiance to the monarch and make a pledge of loyalty to the UK, promising to respect its rights, freedoms and laws. You receive your certificate of naturalisation at the ceremony — you are not a citizen until then."],
 keys:["<b>24 questions, 45 minutes, 18 to pass</b> (75%)","Ages <b>18–64</b> normally must take it; exemptions for age and long-term medical conditions","English at <b>B1</b> speaking and listening","Retake after <b>7 days</b>, paying again each time","Ceremony: <b>oath or affirmation of allegiance</b> plus <b>pledge of loyalty</b>"]}
]},
{n:2,name:"What is the UK?",short:"The UK",blurb:"Nations, capitals, languages and the shape of the country.",sections:[
 {id:"2a",title:"Four nations, one kingdom",body:[
 "The country's full name is the United Kingdom of Great Britain and Northern Ireland. Great Britain is the large island containing England, Scotland and Wales. Add Northern Ireland and you have the UK. The Republic of Ireland is a separate, independent country.",
 "The Channel Islands and the Isle of Man are Crown dependencies. They are closely linked to the UK and the King is their head of state, but they have their own governments and are not part of the UK. British overseas territories — the Falkland Islands, St Helena, Gibraltar and others — are also linked without being part of it.",
 "The UK Parliament sits at Westminster in London and legislates for the whole country, but Scotland, Wales and Northern Ireland each have their own devolved administration handling matters such as health and education."],
 keys:["<b>UK</b> = England, Scotland, Wales, Northern Ireland","<b>Great Britain</b> = England, Scotland, Wales","Capitals: <b>London, Edinburgh, Cardiff, Belfast</b>","Crown dependencies: <b>Channel Islands, Isle of Man</b> — not part of the UK","Overseas territories include the <b>Falkland Islands</b> and <b>St Helena</b>"]},
 {id:"2b",title:"People and languages",body:[
 "The UK's population is roughly 68 million, and has grown steadily since the first census in 1801. About 84% live in England, around 8% in Scotland, 5% in Wales and 3% in Northern Ireland. The population is ageing, and immigration has shaped it throughout its history — from Huguenots and Jewish refugees to post-war arrivals from the Caribbean and South Asia.",
 "English is the main language, but it is not the only official one. Welsh has equal status with English in Wales and appears on road signs, in schools and on television. Scottish Gaelic is spoken in parts of the Highlands and Islands. In Northern Ireland, Irish and Ulster Scots are both used.",
 "A census is taken every ten years and is where most of these figures come from."],
 keys:["Population roughly <b>68 million</b>","About <b>84%</b> live in England","<b>Welsh</b> in Wales, <b>Gaelic</b> in parts of Scotland, <b>Irish and Ulster Scots</b> in Northern Ireland","A <b>census</b> is taken every ten years; the first was in <b>1801</b>"]}
]},
{n:3,name:"A long and illustrious history",short:"History",blurb:"From Stone Age Britain to the present day — the largest part of the test.",sections:[
 {id:"3a",title:"Early Britain and the Romans",body:[
 "Britain was joined to mainland Europe until rising seas cut it off around 10,000 years ago; the first people walked here. Stone Age remains include Stonehenge in Wiltshire, probably a site of seasonal ceremony, and Skara Brae on Orkney, the best preserved prehistoric village in northern Europe.",
 "Bronze Age people lived in roundhouses and buried their dead in round barrows. Iron Age people built hill forts such as Maiden Castle in Dorset, spoke languages in the Celtic family, and minted Britain's first coins.",
 "Julius Caesar's raid in 55 BC failed. The real conquest came in AD 43 under the Emperor Claudius. Boudicca, queen of the Iceni, led a famous revolt against Roman rule. Around AD 122 Hadrian's Wall was built across northern England to hold back the tribes of what is now Scotland — a country the Romans never conquered, along with Ireland. The Romans left around AD 410, leaving roads, towns and the beginnings of Christianity."],
 keys:["<b>Stonehenge</b> (Wiltshire); <b>Skara Brae</b> (Orkney)","<b>55 BC</b> Caesar fails; <b>AD 43</b> Claudius succeeds","<b>Boudicca</b> — queen of the Iceni who revolted","<b>Hadrian's Wall</b>, c. AD 122","Romans leave around <b>AD 410</b>"]},
 {id:"3b",title:"Anglo-Saxons, Vikings and Normans",body:[
 "From around AD 450 the Jutes, Angles and Saxons settled, and by AD 600 Anglo-Saxon kingdoms were established in much of England. The ship burial at Sutton Hoo in Suffolk shows their wealth. Christianity spread through missionaries: St Augustine arrived from Rome in AD 597 and became the first Archbishop of Canterbury, while St Columba founded a monastery on Iona.",
 "Viking raids began in AD 789. The Vikings later settled, especially in the north and east, in the area known as the Danelaw. Alfred the Great of Wessex defeated them and united much of England. In Scotland, Kenneth MacAlpin brought the Picts and Scots together.",
 "In 1066 William of Normandy defeated King Harold at the Battle of Hastings — the last successful foreign invasion of England. The Bayeux Tapestry tells the story. William ordered the Domesday Book, completed in 1086, a survey of who owned what across England. Norman French reshaped the language and Norman castles reshaped the landscape."],
 keys:["<b>Sutton Hoo</b> — Anglo-Saxon ship burial","<b>AD 597</b> St Augustine; <b>St Columba</b> at Iona","<b>AD 789</b> first Viking raids; <b>Alfred the Great</b> defeats them","<b>1066</b> Battle of Hastings — William the Conqueror","<b>1086</b> Domesday Book"]},
 {id:"3c",title:"The Middle Ages",body:[
 "The medieval centuries were dominated by war and by the slow growth of limits on royal power. In 1215 King John's barons forced him to agree Magna Carta — the Great Charter — establishing that the king was not above the law. Parliament grew out of the councils that followed, eventually splitting into Lords and Commons.",
 "Edward I annexed Wales by statute in 1284 after a campaign of conquest and castle building. In Scotland, Robert the Bruce defeated the English at Bannockburn in 1314. In Ireland, English control shrank to the Pale around Dublin.",
 "Abroad, the Hundred Years War with France ran from 1337 to 1453, including Henry V's victory at Agincourt in 1415. At home, the Black Death of 1348 killed perhaps a third of the population, creating labour shortages that weakened feudal ties and strengthened the position of ordinary workers.",
 "Finally, the Wars of the Roses (1455–1485) set the House of Lancaster against the House of York. Henry Tudor won at Bosworth Field in 1485, becoming Henry VII and founding the Tudor dynasty."],
 keys:["<b>1215</b> Magna Carta — King John","<b>1284</b> Wales annexed; <b>1314</b> Bannockburn","<b>1337–1453</b> Hundred Years War; <b>1415</b> Agincourt","<b>1348</b> Black Death","<b>1455–85</b> Wars of the Roses; <b>1485</b> Bosworth Field"]},
 {id:"3d",title:"Tudors and Stuarts",body:[
 "Henry VIII wanted his marriage to Catherine of Aragon annulled. When the Pope refused, he broke with Rome and made himself head of the Church in England. He had six wives in all and dissolved the monasteries. His son Edward VI brought in the Book of Common Prayer; his daughter Mary I tried to restore Catholicism and earned the name 'Bloody Mary'.",
 "Elizabeth I reigned from 1558. Her forces defeated the Spanish Armada in 1588, and her reign saw an explosion of theatre and poetry, above all Shakespeare. Mary, Queen of Scots — a Catholic rival — was held prisoner in England and executed in 1587.",
 "When Elizabeth died childless in 1603, James VI of Scotland became James I of England: the Union of the Crowns. The Gunpowder Plot to blow up Parliament failed in 1605. Conflict between crown and Parliament led to civil war in 1642, Cavaliers against Roundheads. Charles I was executed in 1649 and Oliver Cromwell ruled as Lord Protector until the Restoration of Charles II in 1660.",
 "The Great Plague struck in 1665 and the Great Fire of London in 1666; Christopher Wren rebuilt St Paul's. The Habeas Corpus Act of 1679 outlawed detention without trial. In 1688 the Glorious Revolution brought William of Orange to the throne, and the Bill of Rights of 1689 confirmed that the monarch must rule through Parliament."],
 keys:["<b>Six wives</b>; break with Rome creates the Church of England","<b>1588</b> Spanish Armada defeated","<b>1603</b> Union of the Crowns — James VI and I","<b>1642–49</b> Civil War; Charles I executed <b>1649</b>","<b>1660</b> Restoration; <b>1665</b> plague; <b>1666</b> fire","<b>1688–89</b> Glorious Revolution and Bill of Rights"]},
 {id:"3e",title:"Union, empire and industry",body:[
 "The Act of Union of 1707 joined England and Scotland into the Kingdom of Great Britain with a single parliament, though Scotland kept its own legal and education systems. Jacobite attempts to restore the Stuarts ended at Culloden in 1746, followed by the suppression of Highland culture and later the Clearances.",
 "Sir Robert Walpole, from 1721, is regarded as the first Prime Minister. The Industrial Revolution then transformed Britain: James Watt's improved steam engine, Richard Arkwright's textile mills, coal, iron and canals made it the first industrial nation and drew millions into new cities.",
 "The Empire grew with it, and so did the slave trade — until abolitionists including William Wilberforce and the Quakers won the abolition of the trade in 1807 and of slavery across the Empire in 1833. Thirteen American colonies had declared independence in 1776.",
 "War with Napoleonic France ended with Nelson's victory and death at Trafalgar in 1805 and Wellington's at Waterloo in 1815."],
 keys:["<b>1707</b> Act of Union — Kingdom of Great Britain","<b>1746</b> Culloden ends the Jacobite risings","<b>1721</b> Walpole, first Prime Minister","<b>1807</b> slave trade abolished; <b>1833</b> slavery abolished","<b>1805</b> Trafalgar (Nelson); <b>1815</b> Waterloo (Wellington)"]},
 {id:"3f",title:"The Victorian age",body:[
 "Victoria reigned from 1837 to 1901, and by the end of it the Empire covered a quarter of the world's population. The Great Exhibition of 1851, housed in the Crystal Palace in Hyde Park, displayed the industry and art of Britain and the world.",
 "Engineering flourished: Isambard Kingdom Brunel built railways, bridges, tunnels and iron steamships. Medicine and nursing were reformed by Florence Nightingale, who worked in the Crimean War and opened a training school at St Thomas' Hospital in 1860, and by Mary Seacole, the Jamaican-born nurse who funded her own passage to care for soldiers near the front.",
 "Politics slowly opened up. The Reform Act of 1832 swept away corrupt seats and widened the vote; further acts followed. The Chartists campaigned for working-class representation. From 1903 Emmeline Pankhurst's Women's Social and Political Union — the suffragettes — pressed for votes for women, won partially in 1918 and fully, on equal terms with men, in 1928."],
 keys:["<b>1837–1901</b> Queen Victoria","<b>1851</b> Great Exhibition, Crystal Palace","<b>Brunel</b> — railways, bridges, ships","<b>1832</b> Reform Act; <b>1903</b> WSPU founded","<b>1918</b> some women vote; <b>1928</b> equal voting at 21"]},
 {id:"3g",title:"The twentieth century",body:[
 "The First World War ran from 1914 to 1918, triggered by the assassination of Archduke Franz Ferdinand. The Battle of the Somme in 1916 cost around 60,000 British casualties on the first day alone. The armistice came at 11am on 11 November 1918, still marked each year with poppies and silence.",
 "Ireland was partitioned in the early 1920s, with the south becoming the Irish Free State and later a republic. The 1930s brought the Great Depression, though new industries grew in the Midlands and south-east.",
 "The Second World War began in 1939. Churchill became Prime Minister in 1940, the year of the Dunkirk evacuation and the Battle of Britain, in which the RAF prevented invasion. The Blitz bombed British cities. D-Day, 6 June 1944, opened the liberation of western Europe; VE Day fell on 8 May 1945 and the war with Japan ended that August.",
 "After the war came the welfare state: the Beveridge Report of 1942 led to social security reform, and Aneurin Bevan founded the NHS in 1948 under Clement Attlee's government. India and Pakistan became independent in 1947, and workers arrived from the Caribbean — the Empire Windrush docked in 1948 — and later from India, Pakistan and Bangladesh."],
 keys:["<b>1914–18</b> First World War; <b>1916</b> the Somme","<b>11 November 1918</b> armistice","<b>1939–45</b> Second World War; Churchill PM from <b>1940</b>","<b>6 June 1944</b> D-Day; <b>8 May 1945</b> VE Day","<b>1942</b> Beveridge Report; <b>1948</b> NHS founded; <b>1948</b> Windrush"]},
 {id:"3h",title:"Modern Britain",body:[
 "The 1960s brought social change and a flourishing of British music and film. Immigration from the Commonwealth continued and equality legislation developed through the following decades.",
 "Margaret Thatcher became the UK's first woman Prime Minister in 1979, leading a decade of privatisation and industrial change, and overseeing the Falklands conflict of 1982. Conflict in Northern Ireland — the Troubles — ran for thirty years until the Good Friday Agreement of 1998 created a power-sharing assembly.",
 "Referendums in 1997 led to devolution: the Scottish Parliament and the Welsh Assembly, now the Senedd, first met in 1999. Britain joined the European Economic Community in 1973, voted in a 2016 referendum to leave the European Union, and left on 31 January 2020.",
 "British science and invention continued: Alan Turing's wartime codebreaking and computing theory, Crick and Watson's DNA structure in 1953 with Franklin and Wilkins, the jet engine, radar, the hovercraft, IVF in 1978, the cloning of Dolly the sheep in 1996, and Sir Tim Berners-Lee's World Wide Web around 1990."],
 keys:["<b>1979</b> Margaret Thatcher, first woman PM","<b>1998</b> Good Friday Agreement","<b>1999</b> devolved parliaments first meet","<b>1973</b> joined EEC; <b>2020</b> left the EU","Inventions: <b>DNA structure, jet engine, radar, IVF, the web</b>"]}
]},
{n:4,name:"A modern, thriving society",short:"Society",blurb:"Faith, festivals, sport, the arts, landmarks and everyday customs.",sections:[
 {id:"4a",title:"Religion and the calendar",body:[
 "The UK is historically Christian, and the Church of England is the established church, with the monarch as its Supreme Governor and the Archbishop of Canterbury as its spiritual head. Some of its bishops sit in the House of Lords. In Scotland the national church is the Church of Scotland, Presbyterian in structure and led by an annually elected Moderator. Everyone has the right to practise any religion or none.",
 "Each nation has a patron saint: St David of Wales on 1 March, St Patrick of Northern Ireland on 17 March, St George of England on 23 April and St Andrew of Scotland on 30 November.",
 "Christmas Day and Easter are the main Christian festivals; Boxing Day on 26 December is a public holiday. Other widely celebrated occasions include New Year and Hogmanay in Scotland, Diwali, Eid al-Fitr and Eid al-Adha, Vaisakhi, Hanukkah, Valentine's Day, Mothering Sunday, Halloween, Bonfire Night on 5 November and Remembrance Day on 11 November."],
 keys:["<b>Church of England</b> — established; monarch is Supreme Governor","<b>Church of Scotland</b> — Presbyterian; led by a Moderator","<b>1 Mar</b> David · <b>17 Mar</b> Patrick · <b>23 Apr</b> George · <b>30 Nov</b> Andrew","<b>5 November</b> Bonfire Night (Gunpowder Plot, 1605)","<b>11 November</b> Remembrance Day — poppies, two-minute silence"]},
 {id:"4b",title:"Sport",body:[
 "Sport is woven into British life. Football's rules were codified by the Football Association, founded in 1863, and each UK nation has its own association and team. Cricket produced the Ashes, contested with Australia since the nineteenth century. Rugby union's Six Nations brings together England, Scotland, Wales, Ireland, France and Italy; Northern Ireland plays as part of the all-Ireland team.",
 "Wimbledon, first held in 1877, is the oldest tennis tournament in the world. St Andrews in Scotland is the home of golf. Horse racing has royal associations, with Royal Ascot and the Grand National at Aintree among the best-known meetings.",
 "London has hosted the Olympic Games three times — 1908, 1948 and 2012. The Paralympics grew from games organised by Dr Ludwig Guttmann at Stoke Mandeville Hospital in 1948. Sir Roger Bannister ran the first sub-four-minute mile in 1954."],
 keys:["<b>FA founded 1863</b>","<b>The Ashes</b> — cricket, England v Australia","<b>Six Nations</b> — rugby union","<b>Wimbledon</b> from 1877; <b>St Andrews</b>, home of golf","London Olympics: <b>1908, 1948, 2012</b>; Paralympics from <b>Stoke Mandeville</b>"]},
 {id:"4c",title:"Arts, music and literature",body:[
 "Classical music includes Handel's Water Music and Messiah, and composers such as Elgar, Vaughan Williams and Britten. The Proms, an eight-week summer season mostly at the Royal Albert Hall, ends with the Last Night. Popular music is recognised by the Mercury Music Prize and the Brit Awards.",
 "Theatre runs from Shakespeare and the Globe to the West End, the Edinburgh Festival Fringe each August, Gilbert and Sullivan operettas and the family pantomime at Christmas. The Laurence Olivier Awards honour London theatre.",
 "In art, Gainsborough, Constable ('The Hay Wain') and Turner defined British painting; Henry Moore and Barbara Hepworth its sculpture; the Turner Prize now rewards contemporary work. Christopher Wren rebuilt St Paul's after the Great Fire, and Capability Brown designed the landscaped parkland around many country houses.",
 "British writing includes Chaucer's Canterbury Tales, Shakespeare, Jane Austen, Dickens, the Brontës, Kipling and Agatha Christie, with the Booker Prize as the leading modern fiction award. Robert Burns wrote in Scots — including 'Auld Lang Syne' — and is celebrated on Burns Night, 25 January. Dylan Thomas wrote 'Under Milk Wood'."],
 keys:["<b>The Proms</b> — Royal Albert Hall","<b>Booker Prize</b> fiction · <b>Turner Prize</b> art · <b>Mercury Prize</b> music · <b>Olivier Awards</b> theatre","<b>Constable</b> 'The Hay Wain'; <b>Wren</b> St Paul's","<b>Edinburgh Fringe</b> each August","<b>Burns Night</b> 25 January"]},
 {id:"4d",title:"Places and landmarks",body:[
 "Natural landmarks include the Giant's Causeway on the north-east coast of Northern Ireland, linked in legend to the giant Finn McCool; Snowdonia in Wales; Loch Lomond and the Trossachs in Scotland; the Lake District in England; and the Broads in Norfolk and Suffolk.",
 "Ben Nevis in Scotland is the UK's highest mountain, Scafell Pike the highest in England, Snowdon the highest in Wales.",
 "Built landmarks include the Tower of London with its Crown Jewels and Yeomen Warders, Edinburgh Castle, the Eden Project in Cornwall, the London Eye and the Elizabeth Tower at Westminster that houses the bell known as Big Ben. Many sites hold UNESCO World Heritage status."],
 keys:["<b>Giant's Causeway</b> — Northern Ireland","<b>Ben Nevis</b> highest in the UK; <b>Scafell Pike</b> England; <b>Snowdon</b> Wales","<b>Eden Project</b> — Cornwall","<b>Big Ben</b> is the bell; the tower is the <b>Elizabeth Tower</b>"]},
 {id:"4e",title:"Everyday life and customs",body:[
 "The currency is the pound sterling, divided into 100 pence, with coins from 1p to £2 and notes of £5, £10, £20 and £50. Scotland and Northern Ireland issue their own banknotes, valid across the UK though not always accepted everywhere.",
 "The Union Flag combines the crosses of St George, St Andrew and St Patrick. Wales is not represented on it because Wales was already joined to England when the flag was created.",
 "Social customs matter more than they might appear. Queuing is taken seriously. People say please, thank you and sorry readily. You must be 18 to buy alcohol, and pubs and shops can refuse to serve anyone who appears drunk. Smoking is banned in enclosed public places and workplaces."],
 keys:["<b>Pound sterling</b>, 100 pence; notes £5–£50","<b>Union Flag</b> — St George, St Andrew, St Patrick; Wales not represented","<b>18</b> to buy alcohol; <b>16–17</b> may drink some alcohol with a meal in limited circumstances","Smoking banned in enclosed public places"]}
]},
{n:5,name:"Government, the law and your role",short:"Government",blurb:"How the country is run, how justice works, and what is expected of you.",sections:[
 {id:"5a",title:"The monarchy and Parliament",body:[
 "The UK is a constitutional monarchy: the King is head of state but does not make political decisions. He appoints the Prime Minister, opens Parliament, receives ambassadors and gives Royal Assent to legislation — all on advice and by convention. Charles III became King in September 2022 after the 70-year reign of Elizabeth II.",
 "Parliament has three parts: the House of Commons, the House of Lords and the monarch. The Commons has 650 elected MPs, each representing a constituency. The Lords is largely made up of life peers appointed for public service, along with some hereditary peers and senior Church of England bishops; it scrutinises and revises legislation but cannot ultimately block the elected chamber.",
 "The Speaker chairs Commons debates impartially and is elected by fellow MPs in a secret ballot. The largest party not in government forms the opposition, with a Shadow Cabinet mirroring ministers. Whips keep MPs organised and voting with their party. Debates are published in Hansard and broadcast to the public."],
 keys:["<b>650 MPs</b>, one per constituency, elected by <b>first past the post</b>","<b>Lords</b>: life peers, some hereditary peers, bishops","<b>Speaker</b> — impartial, elected by MPs in secret ballot","<b>Hansard</b> — the official record of debates","<b>Royal Assent</b> — formal approval of new laws"]},
 {id:"5b",title:"Elections, devolution and local government",body:[
 "A general election must be held at least every five years; a by-election fills a single vacant seat. You must be on the electoral register to vote, and voting is at 18. In many elections you now need accepted photo ID at the polling station. If you cannot attend, you can apply for a postal vote or appoint a proxy.",
 "Devolved government gives Scotland, Wales and Northern Ireland power over areas such as health, education, housing and local transport. The Scottish Parliament at Holyrood has 129 MSPs; the Senedd in Cardiff has Members of the Senedd; the Northern Ireland Assembly at Stormont operates on a power-sharing basis under the Good Friday Agreement. Defence, foreign affairs, immigration and most tax policy remain reserved to Westminster.",
 "Local councils run services including schools, social care, rubbish collection, planning and libraries, funded by council tax and central government grants. Some areas elect a mayor.",
 "You can take part by voting, contacting your MP or councillor, attending an MP's surgery, joining a party or campaign, standing for election yourself, becoming a school governor, or volunteering."],
 keys:["General election at least every <b>five years</b>","<b>Holyrood</b> 129 MSPs; <b>Senedd</b> Cardiff; <b>Stormont</b> Belfast","Reserved to Westminster: <b>defence, foreign affairs, immigration</b>","Councils: schools, social care, planning, waste — funded by <b>council tax</b>"]},
 {id:"5c",title:"The law and the courts",body:[
 "Criminal law covers offences against society and is usually enforced by the state; civil law settles disputes between individuals or organisations, such as debt, employment and housing.",
 "In England, Wales and Northern Ireland, less serious criminal cases go to magistrates' courts, heard by unpaid magistrates known as Justices of the Peace. Serious cases go to the Crown Court before a judge and a jury of 12. In Scotland, minor cases are heard by Justices of the Peace or in the Sheriff Court; juries there have 15 members and can find a case not proven. Civil claims go to the County Court, with a simpler small claims route for lower-value disputes. Young people aged 10 to 17 appear in Youth Courts in England, Wales and Northern Ireland; Scotland uses the Children's Hearings System.",
 "The police must themselves obey the law. In England and Wales, elected Police and Crime Commissioners hold forces to account, and complaints can be made to the force or an independent body.",
 "Serious offences include carrying a weapon, drug offences (Classes A, B and C), domestic violence, female genital mutilation, forced marriage, so-called 'honour' crimes, hate crime and terrorism. The Equality Act protects people from discrimination on grounds including age, disability, race, religion, sex, sexual orientation and gender reassignment. If you need legal help, solicitors, Citizens Advice, law centres and, for some cases, legal aid are available."],
 keys:["<b>Magistrates' court</b> minor crime; <b>Crown Court</b> serious crime, jury of 12","Scotland: <b>Sheriff Court</b>, jury of 15, verdict of <b>not proven</b>","<b>County Court</b> — civil claims; small claims for lower values","Drugs classified <b>A, B and C</b>","<b>Equality Act</b> protected characteristics"]},
 {id:"5d",title:"Money, work and everyday duties",body:[
 "Income tax and National Insurance are usually deducted by your employer through PAYE. Self-employed people file a Self Assessment return; the online deadline is 31 January after the end of the tax year. Your National Insurance number records your contributions and entitlement to benefits and the state pension — it is not a form of identification and should be kept private.",
 "To drive you normally need to be 17 (16 for a moped), hold a valid licence, have insurance, and hold an MOT certificate once the vehicle is three years old. Driving without these is a criminal offence.",
 "Other everyday duties include registering with a GP, paying council tax, holding a TV licence to watch live television or BBC iPlayer, and attending jury service if called — people on the electoral register aged 18 to 70 may be summoned."],
 keys:["<b>PAYE</b> — tax deducted by employer","<b>Self Assessment</b> deadline <b>31 January</b> online","Driving: <b>17</b>, licence, insurance, <b>MOT at 3 years</b>","<b>Jury service</b> — ages 18 to 70, from the electoral register"]},
 {id:"5e",title:"The UK in the world",body:[

const GUIDE=[
{t:"What the test actually is",h:"<p>The Life in the UK test is a computer-based multiple-choice exam taken at an approved centre. It is part of the Knowledge of Language and Life requirement for indefinite leave to remain and for naturalisation as a British citizen.</p><ul><li><b>24 questions in 45 minutes</b></li><li><b>18 correct answers to pass</b> — that is 75%</li><li>Questions are drawn from the official handbook, <i>Life in the United Kingdom: A Guide for New Residents</i></li><li>Question formats include choosing one answer from four, choosing two correct answers, deciding whether a statement is true or false, and picking the correct statement from a pair</li></ul><p>You get your result at the centre the same day. If you pass you receive a unique reference number — keep it safe, because your application will need it.</p>"},
{t:"Booking, ID and the fee",h:"<p>Book only through the official GOV.UK service. Other sites charge extra for nothing.</p><ul><li>The fee is <b>£50 per attempt</b>, non-refundable</li><li>You must book <b>at least three days in advance</b></li><li>There are over 30 test centres across the UK, and you choose yours when booking</li><li>You need an email address, a debit or credit card, and accepted ID</li></ul><p>Acceptable ID usually includes a valid passport, a biometric residence permit or card, a UK photocard driving licence, an EU identity card, or a travel document. <b>The name and address you book with must match your ID exactly.</b> A mismatch is the single most common reason people are turned away at the door and lose their fee.</p>"},
{t:"Who has to take it, and who doesn't",h:"<p>Most applicants aged <b>18 to 64</b> must take the test. You are normally exempt if you are:</p><ul><li>Under 18 or aged 65 and over on the date of application</li><li>Unable to take it because of a long-term physical or mental condition — this needs supporting evidence from a doctor</li></ul><p>If you already passed the test when you applied for settlement, you do <b>not</b> need to take it again for citizenship. The pass does not expire.</p><p>You also need to satisfy the English language requirement separately, normally at B1 speaking and listening, unless you hold a degree taught in English or are a national of a majority English-speaking country.</p>"},
{t:"On the day",h:"<ul><li>Arrive early. Most centres ask you to be there <b>at least 15 minutes</b> before your slot and will refuse latecomers.</li><li>Bring the same ID you booked with, and your booking confirmation.</li><li>You cannot take bags, phones, notes or a watch into the test room; lockers are usually provided.</li><li>You will do a short practice run of a few questions first so the software is familiar.</li><li>You can flag questions and come back to them. Use it — answer everything you are sure of first.</li><li>45 minutes is generous for 24 questions. Most people finish in around 15 to 20 minutes.</li><li>Never leave a question blank. There is no penalty for a wrong answer, so always guess.</li></ul><p>You are told whether you passed before you leave. You are not given your score or which questions you got wrong.</p>"},
{t:"If you fail",h:"<p>Failing is common and it is not the end of anything. You can retake the test as many times as you need.</p><ul><li>You must wait <b>7 days</b> between attempts</li><li>You pay the <b>£50 fee again</b> each time</li><li>Your application is not affected by earlier failures</li></ul><p>If you failed, the usual cause is thin coverage of one area rather than weakness everywhere. Go back to the chapter you found hardest, work through the notes properly rather than only doing questions, and only book again once you are consistently scoring 21 or more on timed mock tests.</p>"},
{t:"How to study — a plan that works",h:"<p>People who pass comfortably tend to follow the same rough shape over three to four weeks.</p><h4>Week 1 — read for understanding</h4><p>Work through the chapter notes without worrying about scores. History is the largest and hardest section, so start there while you are fresh. Do a short practice set after each section so the material sticks.</p><h4>Week 2 — drill the facts</h4><p>Dates, names and numbers are where most marks are lost. Use flashcards in short bursts — ten minutes several times a day beats an hour once a week. Review the questions you got wrong rather than repeating the ones you already know.</p><h4>Week 3 — test conditions</h4><p>Take full timed mock tests. Aim for <b>21 out of 24 or better, three times in a row</b>, before booking. That margin absorbs a bad day and an unfamiliar question.</p><h4>Throughout</h4><ul><li>Explain a topic out loud to someone. If you cannot, you do not know it yet.</li><li>Group facts that look alike — the four patron saints together, the three London Olympics together.</li><li>Do not memorise question wording. The real questions are phrased differently.</li></ul>"},
{t:"The traps people fall into",h:"<ul><li><b>Great Britain and the United Kingdom.</b> Great Britain is England, Scotland and Wales. Add Northern Ireland for the UK.</li><li><b>Crown dependencies.</b> The Isle of Man and the Channel Islands are <i>not</i> part of the UK.</li><li><b>Numbers that look similar.</b> 1066, 1086, 1215. 1807 and 1833. 1918 and 1928. Learn them as pairs.</li><li><b>Jury sizes.</b> 12 in England, Wales and Northern Ireland; 15 in Scotland.</li><li><b>Scottish legal terms.</b> Sheriff Court, Justices of the Peace, and the verdict of 'not proven'.</li><li><b>Wales and the Union Flag.</b> Wales is not represented on it.</li><li><b>Big Ben</b> is the bell, not the tower. The tower is the Elizabeth Tower.</li><li><b>Select-two questions.</b> If a question asks for two answers, you must get both right to score.</li></ul>"},
{t:"After you pass: the citizenship route",h:"<p>The test is one requirement among several. For naturalisation as an adult you generally need to:</p><ul><li>Be 18 or over and of sound mind</li><li>Hold indefinite leave to remain, settled status or equivalent — usually for <b>12 months</b> before applying (not required if you are married to a British citizen)</li><li>Have lived in the UK for <b>5 years</b> before applying, or 3 if married to a British citizen</li><li>Not have been outside the UK for more than <b>450 days</b> in those 5 years, or more than 90 days in the last 12 months</li><li>Be of good character</li><li>Have passed the Life in the UK test and met the English requirement</li></ul><p>You apply on form AN, usually online. Fees rose on 8 April 2026: the adult naturalisation fee is <b>£1,709</b>, plus a <b>£130</b> ceremony fee, paid together — a total of <b>£1,839</b>. The ceremony fee is refunded if the application is refused or withdrawn. Indefinite leave to remain costs considerably more. Always check GOV.UK for the current figures before you pay.</p>"},
{t:"The citizenship ceremony",h:"<p>If your application is approved you are invited to a ceremony, normally within three months and usually arranged by your local council. Attendance is required before you become a citizen.</p><ul><li>You swear an <b>oath of allegiance</b> to the monarch, or make an <b>affirmation</b> if you prefer not to swear a religious oath</li><li>You make a <b>pledge of loyalty</b> to the United Kingdom, promising to respect its rights, freedoms and laws</li><li>You receive your <b>certificate of naturalisation</b></li></ul><p>Most ceremonies are group events with guests welcome. Once you have the certificate you can apply for a British passport — the standard adult online passport fee is around £102.</p>"},
{t:"Meeting the English requirement",h:"<p>The Life in the UK test is only half of the Knowledge of Language and Life requirement. You also need to show English at <b>B1 level in speaking and listening</b> (CEFR B1), unless you are exempt.</p><h4>Ways to meet it</h4><ul><li>Pass an approved <b>Secure English Language Test (SELT)</b> at B1 or above in speaking and listening, taken at an approved centre in the UK or abroad</li><li>Hold a <b>degree taught or researched in English</b> — if it was awarded outside the UK you will usually need an Ecctis statement confirming the level and that it was taught in English</li><li>Be a national of a <b>majority English-speaking country</b></li><li>Be aged <b>65 or over</b>, or be exempt on long-term medical grounds</li></ul><p>A B1 speaking and listening test typically costs around £150 and takes under half an hour. You are assessed on holding a conversation, giving opinions and understanding spoken English — not on writing or grammar exercises. The certificate does not expire for nationality purposes, but always check the current list of approved providers on GOV.UK before booking, because it changes.</p><p>The listening and speaking practice in this app is built to that level. It is preparation, not a substitute for an approved test.</p>"},
{t:"The last week before your test",h:"<p>By this stage, new material helps less than consolidating what you have.</p><ul><li><b>Seven days out.</b> Take a full mock test. Whatever chapter comes out lowest, reread those sections rather than grinding more questions.</li><li><b>Five days out.</b> Work only through the questions you have got wrong. Flashcards in short bursts for dates and numbers.</li><li><b>Three days out.</b> Two more timed mocks. You want 21 or better without feeling rushed.</li><li><b>The day before.</b> Check the address of the test centre, the time, and that your ID matches your booking exactly. Light revision only — flashcards, not full chapters.</li><li><b>On the day.</b> Eat something, arrive fifteen minutes early, and remember there is no penalty for a wrong answer. Never leave a question blank.</li></ul><p>If you have set a test date in this app, the home screen will show you how many days are left and roughly how many questions a day you need to keep pace.</p>"},
{t:"Useful facts about this app",h:"<p>This is an independent study app. It is <b>not affiliated with, endorsed by or connected to the Home Office or any UK government department</b>. The official source of test material is the Home Office handbook, <i>Life in the United Kingdom: A Guide for New Residents</i>, and questions in the real test are taken from it.</p><p>Everything here — notes, practice questions and explanations — has been written independently to cover the same subject matter. Use it alongside the official handbook, not instead of it.</p><p>Rules, fees and requirements change. Figures here were correct in September 2026, but always confirm current details on GOV.UK before booking or applying.</p>"}
];

function mastery(c){const ids=idxOf(c);let m=0;ids.forEach(i=>{const st=S.stats[i];if(st&&st.l)m++;});return{done:m,total:ids.length,pct:ids.length?Math.round(m/ids.length*100):0};}
function overall(){let m=0;QUESTIONS.forEach((q,i)=>{const st=S.stats[i];if(st&&st.l)m++;});return Math.round(m/QUESTIONS.length*100);}
function missed(){return QUESTIONS.map((q,i)=>i).filter(i=>{const st=S.stats[i];return st&&st.l===0;});}

function toOrig(a,ord){if(a===undefined||a===null)return a;return Array.isArray(a)?a.map(x=>ord[x]):ord[a];}
function rightAt(q,n,ord){return Array.isArray(q.k)?q.k.includes(ord[n]):q.k===ord[n];}
function isRight(q,a){if(Array.isArray(q.k)){return Array.isArray(a)&&a.length===q.k.length&&q.k.every(x=>a.includes(x));}return a===q.k;}
function bumpStreak(){
  const t=today();
  if(S.daily.d!==t){S.daily={d:t,n:0};}
  S.daily.n++;
  if(S.streak.last!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak.n=(S.streak.last===y)?S.streak.n+1:1;
    S.streak.last=t;
  }
}

const NativeSpeech=window.Capacitor?.isNativePlatform() ? window.Capacitor.registerPlugin("TextToSpeech") : null;
/* speech */
const TTS={
  ok:!!NativeSpeech||(typeof window!=="undefined"&&"speechSynthesis" in window),v:null,busy:false,serial:0,
  pick(){if(!this.ok||NativeSpeech)return;let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
    this.v=vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang&&v.lang.indexOf("en")===0)||null;},
  speak(text,rate,onend){
    if(!this.ok)return false;
    if(NativeSpeech){
      const request=++this.serial;this.busy=true;
      (async()=>{
        await NativeSpeech.stop();
        const {voices}=await NativeSpeech.getSupportedVoices();
        let voice=voices.findIndex(v=>v.localService&&v.lang==="en-GB");
        if(voice<0)voice=voices.findIndex(v=>v.localService&&/^en(?:-|$)/.test(v.lang));
        if(voice<0)throw new Error("offline-voice");
        if(request!==this.serial)return;
        // Android limits each utterance; split long study notes without losing text.
        const chunks=String(text).match(/[\s\S]{1,3000}(?:\s|$)|[\s\S]{1,3000}/g)||[];
        for(const chunk of chunks){
          if(request!==this.serial)return;
          await NativeSpeech.speak({text:chunk,lang:voices[voice].lang,voice,rate:rate||1,pitch:1,volume:1,queueStrategy:0});
        }
      })().catch(()=>{
        if(request!==this.serial)return;
        if(R.v==="listen")R.tr=true;
        toast("Download an English offline voice in Android text-to-speech settings. You can still read the text.");
      }).finally(()=>{if(request===this.serial){this.busy=false;if(onend)onend();}});
      return true;
    }
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=rate||1;u.pitch=1;u.lang="en-GB";if(this.v)u.voice=this.v;
      this.busy=true;
      u.onend=u.onerror=()=>{this.busy=false;if(onend)onend();};
      speechSynthesis.speak(u);return true;
    }catch(e){this.busy=false;return false;}
  },
  stop(){this.serial++;if(NativeSpeech)NativeSpeech.stop().catch(()=>{});else if(this.ok){try{speechSynthesis.cancel();}catch(e){}}this.busy=false;}
};

let Z=null,tick=null;
function startQuiz(ids,mode,title,chapter){
  if(!ids.length){toast("Nothing to practise here yet");return;}
  Z={ids,mode,title,chapter,i:0,ans:{},flags:{},sel:null,checked:false,left:mode==="exam"?45*60:0,done:false,
    ord:ids.map(()=>shuffle([0,1,2,3]))};
  if(tick)clearInterval(tick);
  if(mode==="exam"){
    tick=setInterval(()=>{
      if(!Z||Z.done){clearInterval(tick);return;}
      Z.left--;
      const t=$("#timer");if(t){t.textContent=mm(Z.left);t.classList.toggle("warn",Z.left<300);}
      if(Z.left<=0){clearInterval(tick);finishQuiz();}
    },1000);
  }
  go("quiz");
}
function recordAnswer(qi,ok){
  const st=S.stats[qi]||{a:0,c:0,l:0};
  st.a++;if(ok)st.c++;st.l=ok?1:0;S.stats[qi]=st;
  bumpStreak();save();
}
function checkNow(){
  const qi=Z.ids[Z.i],q=QUESTIONS[qi];
  if(Z.sel===null||(Array.isArray(q.k)&&(!Array.isArray(Z.sel)||Z.sel.length<q.k.length)))return;
  Z.ans[Z.i]=Z.sel;Z.checked=true;
  recordAnswer(qi,isRight(q,toOrig(Z.sel,Z.ord[Z.i])));
  render();
}
function nextQ(){
  if(Z.i<Z.ids.length-1){Z.i++;Z.sel=Z.ans[Z.i]!==undefined?Z.ans[Z.i]:null;Z.checked=Z.mode==="practice"&&Z.ans[Z.i]!==undefined;window.scrollTo(0,0);render();}
  else if(Z.mode==="practice")finishQuiz();
  else go("review-grid");
}
function prevQ(){if(Z.i>0){Z.i--;Z.sel=Z.ans[Z.i]!==undefined?Z.ans[Z.i]:null;Z.checked=Z.mode==="practice"&&Z.ans[Z.i]!==undefined;window.scrollTo(0,0);render();}}
function finishQuiz(){
  if(tick)clearInterval(tick);
  Z.done=true;
  let score=0;
  Z.ids.forEach((qi,n)=>{
    const q=QUESTIONS[qi];const a=Z.ans[n];
    const ok=a!==undefined&&isRight(q,toOrig(a,Z.ord[n]));
    if(ok)score++;
    if(Z.mode==="exam"){if(a!==undefined)recordAnswer(qi,ok);else recordAnswer(qi,false);}
  });
  Z.score=score;
  if(Z.mode==="exam"){
    S.tests.unshift({d:Date.now(),s:score,t:Z.ids.length});
    S.tests=S.tests.slice(0,40);save();
  }
  go("results",{},true);
}
function exitQuiz(){if(tick)clearInterval(tick);Z=null;go("home",{},true);}

let SP={id:null,left:0,phase:null};
function spStop(){if(SP.id)clearInterval(SP.id);SP={id:null,left:0,phase:null};if(typeof TTS!=="undefined")TTS.stop();}
function spRun(phase,secs){
  SP.phase=phase;SP.left=secs;
  if(SP.id)clearInterval(SP.id);
  SP.id=setInterval(()=>{
    SP.left--;
    const t=document.getElementById("sptime");if(t)t.textContent=mm(Math.max(0,SP.left));
    if(SP.left<=0){
      clearInterval(SP.id);SP.id=null;
      if(phase==="prep"){TTS.speak("Start speaking now.");spRun("talk",120);render();}
      else{SP.phase="done";TTS.speak("Thank you. That is the end of the task.");render();}
    }
  },1000);
  render();
}

function searchAll(q){
  const t=(q||"").toLowerCase().trim();
  if(t.length<2)return null;
  const secs=[];
  CHAPTERS.forEach(c=>c.sections.forEach(x=>{
    if((x.title+" "+x.body.join(" ")+" "+x.keys.join(" ")).toLowerCase().indexOf(t)>-1)secs.push({c,s:x});
  }));
  const cards=FLASHCARDS.filter(c=>(c.f+" "+c.b).toLowerCase().indexOf(t)>-1);
  const qs=QUESTIONS.map((x,i)=>i).filter(i=>{const x=QUESTIONS[i];
    return (x.q+" "+x.a.join(" ")+" "+x.e+" "+x.t).toLowerCase().indexOf(t)>-1;});
  return {secs,cards,qs};
}

  return `<div class="scroller" style="margin-bottom:14px">

function vQuiz(){
  const qi=Z.ids[Z.i],q=QUESTIONS[qi];
  const multi=Array.isArray(q.k);
  const ord=Z.ord[Z.i];
  const sel=Z.sel;
  const isSel=n=>multi?(Array.isArray(sel)&&sel.includes(n)):sel===n;
  const saved=S.marks.includes(qi);
  const letters="ABCD";
  const opts=ord.map((oi,n)=>{
    const o=q.a[oi];
    let cls="opt";
    if(Z.mode==="practice"&&Z.checked){
      const right=rightAt(q,n,ord);
      if(right)cls+=" ok";
      else if(isSel(n))cls+=" bad";
      cls+=" locked";
    } else if(isSel(n))cls+=" sel";
    return `<button class="${cls}" data-act="opt" data-n="${n}"><span class="mark">${letters[n]}</span><span>${o}</span></button>`;
  }).join("");
  const ok=Z.checked&&isRight(q,toOrig(sel,ord));
  return `<div class="qbar">
    <div class="qbar-top">
      <button class="tb-btn" data-act="quit" aria-label="Leave this session" style="margin-left:-9px">${ic("x",19)}</button>
      <span class="count">${Z.i+1} of ${Z.ids.length}</span>
      ${Z.mode==="exam"?`<span class="timer" id="timer">${mm(Z.left)}</span>
        <button class="tb-btn" data-act="grid" aria-label="See all questions" style="width:32px;height:32px;margin-right:-6px">${ic("grid",18)}</button>`:`<span class="timer">${Z.title}</span>`}
    </div>
    <div class="track"><i style="width:${(Z.i+(Z.checked||Z.ans[Z.i]!==undefined?1:0))/Z.ids.length*100}%"></i></div>
  </div>
  <main style="padding:0 16px 130px">
    <h2 class="question">${q.q}</h2>
    <div class="qmeta">
      <span>${CHAPTERS.find(c=>c.n===q.c).short} · ${q.t}</span>
      ${multi?`<span class="chip brass">Choose 2</span>`:""}
      <button class="chip spk" data-act="readq" aria-label="Read this question aloud" style="margin-left:auto">${ic("sound",13)}</button>
      <button class="chip ${saved?"on":""}" data-act="save">${ic("flag",13)} ${saved?"Saved":"Save"}</button>
    </div>
    <div class="opts">${opts}</div>
    ${Z.mode==="practice"&&Z.checked?`<div class="feedback ${ok?"":"no"}" role="status" aria-live="polite">
      <strong>${ok?"Correct":"Not quite"}</strong>
      <p>${q.e}</p></div>`:""}
  </main>
  <div class="qfoot"><div class="qfoot-in">
    ${Z.mode==="exam"?`<button class="btn ghost" data-act="prev" style="flex:0 0 33%" ${Z.i===0?"disabled":""}>Back</button>
      <button class="chip ${Z.flags[Z.i]?"on":""}" data-act="flagq" aria-label="Flag this question for review" style="flex:none;padding:12px">${ic("flag",14)}</button>
      <button class="btn" data-act="next" style="flex:1">${Z.i===Z.ids.length-1?"Review":"Next"}</button>`
    : Z.checked?`<button class="btn" data-act="next">${Z.i===Z.ids.length-1?"See results":"Next question"}</button>`
    :`<button class="btn" data-act="check" ${sel===null||(multi&&(!Array.isArray(sel)||sel.length<2))?"disabled":""}>Check answer</button>`}
  </div></div>`;
}

function vReviewGrid(){
  const unanswered=Z.ids.filter((_,n)=>Z.ans[n]===undefined).length;
  return `<div class="sect-label">Before you submit</div>
  <div class="sect-note">${unanswered?`${unanswered} question${unanswered>1?"s":""} still unanswered. There is no penalty for a wrong answer — never leave one blank.`:"All 24 answered. Tap any number to go back."}</div>
  <div class="gridnums">
    ${Z.ids.map((_,n)=>`<button class="gn ${Z.ans[n]!==undefined?"ans":""} ${Z.flags[n]?"flag":""}" data-act="jump" data-n="${n}">${n+1}</button>`).join("")}
  </div>
  <div class="stack" style="margin-top:20px">
    <button class="btn brass" data-act="submit">Submit test</button>
    <button class="btn ghost" data-act="back">Back to the test</button>
  </div>

}

function vResults(){
  const total=Z.ids.length,score=Z.score,pass=Z.mode==="exam"?score>=18:score/total>=0.75;
  const byCh={};
  Z.ids.forEach((qi,n)=>{const c=QUESTIONS[qi].c;byCh[c]=byCh[c]||{r:0,t:0};byCh[c].t++;if(Z.ans[n]!==undefined&&isRight(QUESTIONS[qi],toOrig(Z.ans[n],Z.ord[n])))byCh[c].r++;});
  const wrong=Z.ids.filter((qi,n)=>!(Z.ans[n]!==undefined&&isRight(QUESTIONS[qi],toOrig(Z.ans[n],Z.ord[n])))).length;
  return `<div class="verdict">
    ${pass&&Z.mode==="exam"?UJ(44):""}
    <div class="score">${score}<span class="of">/${total}</span></div>
    <div class="tag ${pass?"pass":"fail"}">${Z.mode==="exam"?(pass?"Pass":"Below the pass mark"):(pass?"Strong round":"Keep going")}</div>
    ${Z.mode==="exam"?`<p class="tiny muted" style="margin-top:12px">You need 18 out of 24 in the real test.</p>`:""}
  </div>
  <div class="sect-label">How it broke down</div>
  <div class="bars">
  ${Object.keys(byCh).sort().map(c=>{const b=byCh[c];const p=Math.round(b.r/b.t*100);return `<div class="bar-row">
    <span class="lab">${CHAPTERS.find(x=>x.n==c).name}</span><span class="val">${b.r}/${b.t}</span>
    <span class="tr"><i style="width:${p}%"></i></span></div>`;}).join("")}
  </div>
  <div class="stack" style="margin-top:20px">
    ${wrong?`<button class="btn" data-act="review-answers">Review the ${wrong} you missed</button>`:""}
    <button class="btn ${wrong?"ghost":""}" data-act="review-all">Go through all ${total} answers</button>
    <button class="btn ghost" data-act="${Z.mode==="exam"?"mock":"again"}">${Z.mode==="exam"?"Take another mock test":"Another set"}</button>
    <button class="btn ghost" data-act="home">Back to home</button>
  </div>`;
}

function vReviewAnswers(){
  const list=R.all?Z.ids.map((qi,n)=>[qi,n]):Z.ids.map((qi,n)=>[qi,n]).filter(([qi,n])=>!(Z.ans[n]!==undefined&&isRight(QUESTIONS[qi],toOrig(Z.ans[n],Z.ord[n]))));
  if(!list.length)return `<div class="empty"><p>Nothing to review — everything was correct.</p></div>`;

  <div class="stack">
  ${list.map(([qi,n])=>{
    const q=QUESTIONS[qi],a=Z.ans[n],multi=Array.isArray(q.k),ord=Z.ord[n];

        return `<div style="display:flex;gap:9px;padding:5px 0;font-size:.9rem;color:var(--${isR?"green":isY?"red":"ink2"})">
        <span style="font-weight:700;flex:none">${letters[x]}</span><span>${o}</span></div>`;}).join("")}

  <button class="btn ghost" style="margin-top:16px" data-act="back">Back to results</button>`;
}

const TABS=[["home","Home","home"],["study","Study","book"],["practice","Practice","target"],["tests","Tests","clock"],["guide","Guide","info"]];

  switch(R.v){
    case "home":return["Settle","Life in the UK test"];

    case "chapter":return[CHAPTERS.find(c=>c.n===R.n).name,"Chapter "+R.n];

    case "practice":return["Practice",null];
    case "tests":return["Mock tests",null];
    case "guide":return["Guide",null];
    case "cards":return["Flashcards",null];
    case "english":return["English at B1",null];
    case "listen":return[LISTENING[R.li].t,"Listening"];
    case "speak":return["Speaking practice",null];
    case "results":return["Results",null];
    case "review-grid":return["Review",null];
    case "review":return[R.all?"All answers":"Missed questions",null];
    case "stats":return["Progress",null];
    case "settings":return["Settings",null];
    case "privacy":return["Privacy policy",null];
    default:return["Settle",null];
  }
}
function render(){
  if(!Z&&["quiz","results","review","review-grid"].includes(R.v)){R={v:"home"};stack=[];}
